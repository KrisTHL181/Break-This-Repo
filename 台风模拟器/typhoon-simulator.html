  };

  /** 地图：陆地填色 → 卫星影像地表色 → 起伏质感 → 海岸线 → 地名 */
  Renderer.prototype.drawMap = function (ctx, cam) {
    var z = cam.zoom, i, k;
    var path = coastPath(z);

    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.globalCompositeOperation = 'source-over';

    /* ① 陆地底色：没有地表色数据的格子（冰盖、常年云区）用它兜底。
          取色板里最常见的植被绿，这样放大色块后露出的底不会与邻格有色差。 */
    ctx.fillStyle = '#305010';
    ctx.fill(path, 'evenodd');

    /* ② 地表色：0.5° 网格直接放大（开双线性），得到植被→荒漠→雪线的连续过渡；
          用 even-odd 裁进陆地，所以海岸线的精度只由轮廓决定，与色块粗细无关。 */
    var rect = terrainRect();
    ctx.save();
    ctx.clip(path, 'evenodd');
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(terrainCanvas(), rect.x, rect.y, rect.w, rect.h);
    ctx.restore();

    /* ③ 山地颗粒感 */
    this.drawLandRelief(ctx, path, cam);

    /* ④ 海岸线：细亮线，是"地图感"的主要来源。
          线宽按屏幕像素恒定，但缩放小于 0.34 时不再继续变粗，
          否则整幅海图会被一圈发光的小岛糊住（参考图里海岸线本来就极细）。 */
    var zc = Math.max(z, 0.34);
    ctx.strokeStyle = 'rgba(110,196,246,0.30)';
    ctx.lineWidth = clamp(2.4 / zc, 0.34, 40);      // 外晕
    ctx.stroke(path);
    ctx.strokeStyle = 'rgba(198,238,255,0.62)';
    ctx.lineWidth = clamp(0.85 / zc, 0.24, 14);     // 细芯线
    ctx.stroke(path);
    ctx.restore();

    /* 地名与城市点：屏幕空间标注，字号恒定。
       注意 drawMap 是在世界变换下被调用的，坐标与字号都会被 zoom 缩放，
       所以这里必须先用 setTransform 回到屏幕空间，否则标注会跑到世界原点上。 */
    if (z > 0.24) {
      ctx.save();
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.font = '11px "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      for (k = 0; k < PLACES.length; k++) {
        var pl = PLACES[k];
        if (z < pl[3]) continue;
        var sx = (lonToX(pl[0]) - cam.cx) * z + cam.vw * 0.5;
        var sy = (latToY(pl[1]) - cam.cy) * z + cam.vh * 0.5;
        if (sx < -40 || sy < -20 || sx > cam.vw + 40 || sy > cam.vh + 20) continue;
        if (pl[4]) {
          ctx.beginPath();
          ctx.arc(sx, sy, 2.2, 0, TWO_PI);
          ctx.fillStyle = 'rgba(160,220,255,0.85)';
          ctx.fill();
        }
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(2,8,16,0.88)';           // 描边保证在任何底色上都看得清
        ctx.strokeText(pl[2], sx + 6, sy);
        ctx.fillStyle = pl[4] ? 'rgba(196,226,250,0.88)' : 'rgba(150,190,224,0.62)';
        ctx.fillText(pl[2], sx + 6, sy);
      }
      ctx.restore();
    }
  };

  /** 每帧绘制：海洋 → 等压线 → 风场 → 路径 → 粒子（残影层） → 眼 → 闪光 → 标记 */
  Renderer.prototype.render = function (world, cam) {
    var ctx = this.ctx;
    var t = world.typhoon;

    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    var z = cam.zoom;

    /* —— 粒子残影层：把上一帧整幅内容按固定比例削弱，形成流线拖尾 ——
     * destination-out 会同时削弱背景，但海洋、等压线、风场、路径每帧都重绘，
     * 因此只有粒子留下有限长度的拖尾（不会无限累积成一片亮斑）。 */
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,' + VIEW.trailFade + ')';
    ctx.fillRect(0, 0, this.w, this.h);
    ctx.restore();

    /* —— 海洋背景 + 地图（海岸线 + 地名）+ 经纬网格 —— */
    this.ensureOceanScale(z);            // 缩放过阈值时按新比例重烤海面贴图
    ctx.save();
    ctx.translate(cam.vw * 0.5 - cam.cx * z, cam.vh * 0.5 - cam.cy * z);
    ctx.scale(z, z);
    this.drawOcean(ctx, cam);
    this.drawMap(ctx, cam);
    this.drawGrid(ctx, cam);        // 经纬网压在陆地上层，和参考图一致
    ctx.restore();

    var envK = t.shearK() * t.repel;
    var flashK = t.flash.a;

    if (CONFIG.visible.isobar) this.drawIsobars(ctx, cam, t);
    if (CONFIG.visible.wind) this.drawWindField(ctx, cam, t, envK);
    if (CONFIG.visible.path) this.drawPath(ctx, cam, t);

    /* —— 粒子：云 + 雨 + 眼墙喷沫，加色混合 —— */
    this.drawParticles(ctx, cam, world, flashK);

    /* —— 风圈：画在云系之上，保证七/十/十二级风圈任何时候都看得见 —— */
    if (CONFIG.visible.wcircle) this.drawWindCircles(ctx, cam, t);

    /* —— 台风眼（留空 + 眼墙高亮） —— */
    this.drawEye(ctx, cam, t, flashK);

    /* —— 雷暴闪光 —— */
    if (flashK > 0.01) this.drawFlash(ctx, cam, t);

    /* —— 中心标记 —— */
    this.drawMarker(ctx, cam, t);

    /* —— 放置模式准星（在屏幕空间绘制，字号恒定） —— */
    if (flags.place) {
      var mx = flags.mx, my = flags.my;
      if (mx > 0 && my > 0 && mx < this.w && my < this.h) {
        var wz = { x: cam.cx + (mx - cam.vw * 0.5) / z, y: cam.cy + (my - cam.vh * 0.5) / z };
        ctx.save();
        ctx.strokeStyle = 'rgba(120,230,255,0.85)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(mx - 16, my); ctx.lineTo(mx - 5, my);
        ctx.moveTo(mx + 5, my);  ctx.lineTo(mx + 16, my);
        ctx.moveTo(mx, my - 16); ctx.lineTo(mx, my - 5);
        ctx.moveTo(mx, my + 5);  ctx.lineTo(mx, my + 16);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(mx, my, 4.5, 0, TWO_PI);
        ctx.stroke();
        var txt = '放置台风 · ' + fmtLon(xToLon(wz.x)) + ' ' + fmtLat(yToLat(wz.y));
        ctx.font = '11px ui-monospace, Consolas, monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(3,10,18,0.9)';
        ctx.strokeText(txt, mx + 12, my + 22);
        ctx.fillStyle = 'rgba(150,235,255,0.95)';
        ctx.fillText(txt, mx + 12, my + 22);
        ctx.restore();
      }
    }

    /* —— 全局暗角（把注意力收到台风中心，渐变对象缓存复用） —— */
    if (!this._vig) {
      var vg = ctx.createRadialGradient(this.w * .5, this.h * .5, Math.min(this.w, this.h) * .34,
                                        this.w * .5, this.h * .5, Math.max(this.w, this.h) * .82);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,0.42)');
      this._vig = vg;
    }
    ctx.save();
    ctx.fillStyle = this._vig;
    ctx.fillRect(0, 0, this.w, this.h);
    ctx.restore();

    if (CONFIG.visible.fps) this.drawHud(ctx, world, cam);
  };

  var _p1 = { x: 0, y: 0 }, _p2 = { x: 0, y: 0 };
  function W2S(cam, wx, wy, out) {
    out.x = (wx - cam.cx) * cam.zoom + cam.vw * 0.5;
    out.y = (wy - cam.cy) * cam.zoom + cam.vh * 0.5;
    return out;
  }

  /** 等压线：以台风为中心的闭合环，越靠近中心越密、越亮 */
  Renderer.prototype.drawIsobars = function (ctx, cam, t) {
    var r0 = Math.max(t.eye * 1.2, 4);
    var rMaxDraw = 620;
    var N = 13;
    ctx.save();
    ctx.lineJoin = 'round';
    for (var i = 1; i <= N; i++) {
      var f = i / N;
      var r = r0 + (rMaxDraw - r0) * Math.pow(f, 1.7);   // 非线性间距
      var p = t.pressure + 6 * i * (1 + f * 1.4);
      if (p > 1016) continue;
      var alp = clamp((0.30 - f * 0.20) * (0.55 + (1000 - t.pressure) / 300), 0.03, 0.36);
      var ex = Math.cos(t.shearDir) * clamp(t.shear / 22, 0, 1) * r * 0.10;  // 切变椭圆化
      var ey = Math.sin(t.shearDir) * clamp(t.shear / 22, 0, 1) * r * 0.04;

      ctx.globalAlpha = alp;
      ctx.strokeStyle = i % 2 === 0 ? 'rgba(160,235,255,1)' : 'rgba(110,180,235,1)';
      ctx.lineWidth = i % 2 === 0 ? 1.25 : 0.85;
      ctx.beginPath();
      var seg = 56;
      for (var s = 0; s <= seg; s++) {
        var a = s / seg * TWO_PI;
        var rr = r * (1 + 0.045 * Math.cos(a * 2 + t.arc * 0.05));
        W2S(cam, t.x + Math.cos(a) * rr + ex * Math.cos(a),
                t.y + Math.sin(a) * rr * 0.96 + ey * Math.sin(a), _p2);
        if (s === 0) ctx.moveTo(_p2.x, _p2.y); else ctx.lineTo(_p2.x, _p2.y);
      }
      ctx.closePath();
      ctx.stroke();

      // 每 3 条标注一次气压
      if (i % 3 === 0 && cam.zoom > 0.32) {
        W2S(cam, t.x, t.y - r + 6, _p2);
        ctx.globalAlpha = clamp(alp * 2.6, 0, 0.72);
        ctx.fillStyle = 'rgba(190,240,255,1)';
        ctx.font = '10px "Segoe UI",system-ui,sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(Math.round(p) + ' hPa', _p2.x + 3, _p2.y);
      }
    }
    ctx.restore();
  };

  /** 风场箭头：规则网格采样风矢量，箭长与颜色随风速变化 */
  Renderer.prototype.drawWindField = function (ctx, cam, t, envK) {
    var step = 80;                                        // 世界坐标间距（km）
    var halfW = cam.vw * 0.5 / cam.zoom + step;
    var halfH = cam.vh * 0.5 / cam.zoom + step;
    var x0 = Math.floor((cam.cx - halfW) / step) * step;
    var y0 = Math.floor((cam.cy - halfH) / step) * step;
    var x1 = cam.cx + halfW, y1 = cam.cy + halfH;

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.1;
    for (var wx = x0; wx <= x1; wx += step) {
      for (var wy = y0; wy <= y1; wy += step) {
        var w = t.windAt(wx, wy, envK);
        if (w.mag < 1.2) continue;
        var ang = Math.atan2(w.y, w.x);
        var L = clamp(7 + Math.log(1 + w.mag) * 7, 7, 30) * cam.zoom;   // 箭长按风速对数缩放
        W2S(cam, wx, wy, _p1);
        var dx = Math.cos(ang), dy = Math.sin(ang);
        var xa = _p1.x - dx * L * .5, ya = _p1.y - dy * L * .5;
        var xb = _p1.x + dx * L * .5, yb = _p1.y + dy * L * .5;
        var rgb = windRGB(w.mag);
        ctx.strokeStyle = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
        ctx.globalAlpha = 0.34;
        ctx.beginPath();
        ctx.moveTo(xa, ya); ctx.lineTo(xb, yb);
        ctx.stroke();
        // 箭头
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.moveTo(xb, yb); ctx.lineTo(xb + Math.cos(ang - 2.5) * 4.2, yb + Math.sin(ang - 2.5) * 4.2);
        ctx.moveTo(xb, yb); ctx.lineTo(xb + Math.cos(ang + 2.5) * 4.2, yb + Math.sin(ang + 2.5) * 4.2);
        ctx.stroke();
      }
    }
    ctx.restore();
  };

  /**
   * 台风路径：照中央气象台预报图的画法 ——
   * ① 半透明的影响带（宽度随当时七级风圈变化，越靠近当前越实）
   * ② 紫色主线
   * ③ 按强度等级着色的时次圆点（黄/蓝/绿/橙/粉/红）
   * ④ 起点空心圈标记生成位置
   */
  Renderer.prototype.drawPath = function (ctx, cam, t) {
    var path = t.path, n = path.length;
    if (n < 2) return;
    var i, j, k;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    /* ① 影响带：逐段描边，宽度随当时的七级风圈走，透明度沿路径渐显；
          末端 8 个采样点不再画带，免得糊住台风眼 */
    ctx.strokeStyle = 'rgba(168,116,226,1)';
    var bandEnd = Math.max(2, n - 8);
    for (i = 1; i < bandEnd; i += 3) {
      k = i / n;
      W2S(cam, path[i - 1].x, path[i - 1].y, _p1);
      W2S(cam, path[i].x, path[i].y, _p2);
      ctx.globalAlpha = clamp(Math.pow(k, 1.8) * 0.085, 0.004, 0.085);
      var r7 = path[i].r7 || 120;
      ctx.lineWidth = Math.max(2, r7 * 0.20 * clamp(cam.zoom, 0.05, 4));
      ctx.beginPath();
      ctx.moveTo(_p1.x, _p1.y);
      ctx.lineTo(_p2.x, _p2.y);
      ctx.stroke();
    }

    /* ② 紫色主线 */
    ctx.strokeStyle = 'rgba(190,126,246,1)';
    for (i = 1; i < n; i++) {
      k = i / n;
      W2S(cam, path[i - 1].x, path[i - 1].y, _p1);
      W2S(cam, path[i].x, path[i].y, _p2);
      ctx.globalAlpha = clamp(Math.pow(k, 1.3) * 0.95, 0.08, 0.95);
      ctx.lineWidth = (0.7 + k * 1.7) * clamp(cam.zoom, 0.4, 1.6);
      ctx.beginPath();
      ctx.moveTo(_p1.x, _p1.y);
      ctx.lineTo(_p2.x, _p2.y);
      ctx.stroke();
    }

    /* ③ 时次圆点：颜色 = 当时强度等级（CMA 六色等级图例） */
    var dotR = clamp(2.6 * clamp(cam.zoom, 0.5, 2.0), 2.0, 5.0);
    for (j = 0; j < n; j += 4) {
      var wj = path[j].w;
      if (wj === undefined) wj = t.wind;
      W2S(cam, path[j].x, path[j].y, _p1);
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = gradeOf(wj)[2];
      ctx.beginPath();
      ctx.arc(_p1.x, _p1.y, dotR, 0, TWO_PI);
      ctx.fill();
    }

    /* ④ 起点：空心圈 + 实心点（生成位置） */
    W2S(cam, path[0].x, path[0].y, _p1);
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(_p1.x, _p1.y, 6, 0, TWO_PI);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath();
    ctx.arc(_p1.x, _p1.y, 1.7, 0, TWO_PI);
    ctx.fill();
    ctx.restore();
  };

  /**
   * 风圈：七级 / 十级 / 十二级风圈（CMA 实况图里的三圈）。
   * 半径由中心风速标定（见 Typhoon.prototype.windR），并按"危险半圆"——
   * 行进方向右侧——做四象限偏心，和实况风圈的不对称一致。
   */
  Renderer.prototype.drawWindCircles = function (ctx, cam, t) {
    if (t.dissipating && t.wind < 10) return;
    W2S(cam, t.x, t.y, _p1);
    var far = 900 + 460 * cam.zoom;
    if (_p1.x < -far || _p1.y < -far || _p1.x > this.w + far || _p1.y > this.h + far) return;

    var sp = Math.sqrt(t.vx * t.vx + t.vy * t.vy);
    var danger = sp > 0.5 ? Math.atan2(t.vy, t.vx) + Math.PI * 0.5 : 0.0;
    var asym = sp > 0.5 ? clamp(sp / 70, 0.05, 0.18) : 0.05;
    var LV = [
      [t.windR(7), '96,178,255', 1.1, 0.075],
      [t.windR(10), '255,206,74', 1.3, 0.095],
      [t.windR(12), '255,86,72', 1.5, 0.115]
    ];
    ctx.save();
    ctx.lineJoin = 'round';
    for (var i = 0; i < LV.length; i++) {
      var R = LV[i][0];
      if (R * cam.zoom < 3.5) continue;
      ctx.beginPath();
      for (var s = 0; s <= 72; s++) {
        var a = s / 72 * TWO_PI;
        var rr = R * (1 + asym * Math.cos(a - danger));
        W2S(cam, t.x + Math.cos(a) * rr, t.y + Math.sin(a) * rr, _p2);
        if (s === 0) ctx.moveTo(_p2.x, _p2.y); else ctx.lineTo(_p2.x, _p2.y);
      }
      ctx.closePath();
      ctx.globalAlpha = LV[i][3];
      ctx.fillStyle = 'rgba(' + LV[i][1] + ',1)';
      ctx.fill();
      ctx.globalAlpha = 0.72;
      ctx.strokeStyle = 'rgba(' + LV[i][1] + ',1)';
      ctx.lineWidth = LV[i][2];
      ctx.stroke();
    }
    ctx.restore();
  };

  /** 粒子层：云 / 雨 / 眼墙喷沫全部用加色混合，拖尾由主循环的淡化实现。
      自适应降画质时整体略微降低不透明度，避免"少画了但看着更脏"。 */
  Renderer.prototype.drawParticles = function (ctx, cam, world, flashK) {
    var n = world.used, i, p;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = this._quality < 1 ? 0.88 : 1;
    for (i = 0; i < n; i++) {
      p = world.pool[i];
      if (p.dead) continue;
      if (!CONFIG.visible.band && p.kind === 'cloud') continue;
      p.draw(ctx, cam, flashK);
    }
    ctx.restore();
  };

  /** 台风眼：抹掉眼内粒子保证眼区干净，再叠一圈眼墙辉光 */  Renderer.prototype.drawEye = function (ctx, cam, t, flashK) {
    var r = Math.max(t.eye, 1.5) * cam.zoom;
    if (r < 0.6) return;
    W2S(cam, t.x, t.y, _p1);

    ctx.save();
    ctx.globalAlpha = 0.92 * t.repel;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(_p1.x, _p1.y, r, 0, TWO_PI);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var halo = ctx.createRadialGradient(_p1.x, _p1.y, r * 0.86, _p1.x, _p1.y, r * 2.9);
    halo.addColorStop(0, 'rgba(120,200,255,' + (0.16 + flashK * 0.18).toFixed(3) + ')');
    halo.addColorStop(0.35, 'rgba(70,150,220,0.07)');
    halo.addColorStop(1, 'rgba(30,80,140,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(_p1.x, _p1.y, r * 2.9, 0, TWO_PI);
    ctx.fill();

    ctx.globalAlpha = 0.32;
    ctx.strokeStyle = 'rgba(170,225,255,1)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(_p1.x, _p1.y, r * 1.02, 0, TWO_PI);
    ctx.stroke();
    ctx.restore();
  };

  /** 雷暴闪光：眼墙附近的短促辉光 */
  Renderer.prototype.drawFlash = function (ctx, cam, t) {
    var a = t.flash.a;
    W2S(cam, t.flash.x, t.flash.y, _p1);
    var R = t.rMax * cam.zoom * 1.4;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(_p1.x, _p1.y, 0, _p1.x, _p1.y, R);
    g.addColorStop(0, 'rgba(226,244,255,' + (0.55 * a).toFixed(3) + ')');
    g.addColorStop(0.35, 'rgba(150,205,255,' + (0.22 * a).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(90,150,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(_p1.x, _p1.y, R, 0, TWO_PI);
    ctx.fill();
    ctx.restore();
  };

  /** 中心十字标记 + 名称标牌 */
  Renderer.prototype.drawMarker = function (ctx, cam, t) {
    W2S(cam, t.x, t.y, _p1);
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(_p1.x - 9, _p1.y); ctx.lineTo(_p1.x - 3, _p1.y);
    ctx.moveTo(_p1.x + 3, _p1.y); ctx.lineTo(_p1.x + 9, _p1.y);
    ctx.moveTo(_p1.x, _p1.y - 9); ctx.lineTo(_p1.x, _p1.y - 3);
    ctx.moveTo(_p1.x, _p1.y + 3); ctx.lineTo(_p1.x, _p1.y + 9);
    ctx.stroke();
    if (cam.zoom > 0.3) {
      ctx.globalAlpha = 0.72;
      ctx.fillStyle = 'rgba(215,240,255,1)';
      ctx.font = '11px "Segoe UI",system-ui,sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(gradeOf(t.wind)[1] + ' · ' + t.wind.toFixed(0) + ' m/s · ' +
                   t.pressure.toFixed(0) + ' hPa', _p1.x + 13, _p1.y + 6);
    }
    ctx.restore();
  };

  /** 右下角 HUD：FPS / 粒子数 / 缩放 / 自适应画质 */
  Renderer.prototype.drawHud = function (ctx, world, cam) {
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.font = '11px ui-monospace,Consolas,monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = 'rgba(150,210,255,0.75)';
    ctx.fillText('FPS ' + this.fps.toFixed(0) + '  |  粒子 ' + world.used +
                 '  |  缩放 ' + (cam.zoom * 100).toFixed(0) + '%' +
                 (this._quality < 1 ? '  |  自适应画质 ' + Math.round(this._quality * 100) + '%' : ''),
                 this.w - 14, this.h - 12);
    ctx.restore();
  };

  /* ==========================================================================
   * 7. Camera 相机 + 鼠标 / 触摸交互
   * ======================================================================== */
  /* minZoom 取 0.14：地图宽 100 个经度（11100 km），1920 宽的屏幕上 0.17 左右就能看全整幅图 */
  var cam = { cx: 0, cy: 0, zoom: 1, vw: 1, vh: 1, minZoom: 0.14, maxZoom: 8 };

  function setupControls(canvas, renderer, world, flags) {
    var dragging = false, lastX = 0, lastY = 0;
    var pointers = {}, nPointers = 0, pinchDist = 0;

    /** 把相机钳制在地图范围内（允许露出半个视口，但不至于把地图甩出屏幕） */
    function clampCam() {
      var mx = Math.max(0, cam.vw * 0.5 / cam.zoom * 0.9);
      var my = Math.max(0, cam.vh * 0.5 / cam.zoom * 0.9);
      cam.cx = clamp(cam.cx, -mx, world.w + mx);
      cam.cy = clamp(cam.cy, -my, world.h + my);
    }
    /** 以屏幕某点为锚点缩放，保证该点对应的世界坐标不动 */
    function zoomAt(sx, sy, k) {
      var old = cam.zoom;
      var nz = clamp(old * k, cam.minZoom, cam.maxZoom);
      if (nz === old) return;
      var wx = cam.cx + (sx - cam.vw * 0.5) / old;
      var wy = cam.cy + (sy - cam.vh * 0.5) / old;
      cam.zoom = nz;
      cam.cx = wx - (sx - cam.vw * 0.5) / nz;
      cam.cy = wy - (sy - cam.vh * 0.5) / nz;
      clampCam();
    }
    function touchDist() {
      var ks = Object.keys(pointers);
      if (ks.length < 2) return 0;
      var a = pointers[ks[0]], b = pointers[ks[1]];
      return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y));
    }
    function touchMid() {
      var ks = Object.keys(pointers);
      var a = pointers[ks[0]], b = pointers[ks[1]];
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }
    function holdFollow() {
      if (!CONFIG.follow) return;                // 用户已关闭自动跟随 → 手动视角保持不动
      flags.dragging = true;
      clearTimeout(flags._t);
      flags._t = setTimeout(function () { flags.dragging = false; }, 2400);
    }
    /** 屏幕坐标 → 世界坐标(km) */
    function screenToWorld(sx, sy) {
      return { x: cam.cx + (sx - cam.vw * 0.5) / cam.zoom,
               y: cam.cy + (sy - cam.vh * 0.5) / cam.zoom };
    }
    /** 在指定世界坐标处放置台风（旧台风快速消散、新台风淡入） */
    function placeAt(wx, wy) {
      var t = world.newTyphoon({ x: clamp(wx, 0, world.w), y: clamp(wy, 0, world.h) });
      cam.cx = t.x; cam.cy = t.y;
      return t;
    }

    /* —— 鼠标拖动平移 / 点选放置台风 —— */
    var downX = 0, downY = 0, moved = 0;
    canvas.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      downX = e.clientX; downY = e.clientY; moved = 0;
      canvas.style.cursor = 'grabbing';
      holdFollow();
    });
    window.addEventListener('mousemove', function (e) {
      flags.mx = e.clientX; flags.my = e.clientY;
      if (!dragging) return;
      moved += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);
      cam.cx -= (e.clientX - lastX) / cam.zoom;
      cam.cy -= (e.clientY - lastY) / cam.zoom;
      lastX = e.clientX; lastY = e.clientY;
      clampCam();
      holdFollow();
    });
    window.addEventListener('mouseup', function (e) {
      dragging = false;
      canvas.style.cursor = flags.place ? 'crosshair' : 'grab';
      /* 放置模式：按下与抬起几乎在同一点（不是拖动视角）才判定为"选点" */
      if (flags.place && moved < 6 &&
          Math.abs(e.clientX - downX) < 6 && Math.abs(e.clientY - downY) < 6) {
        var w = screenToWorld(e.clientX, e.clientY);
        placeAt(w.x, w.y);
      }
    });
    canvas.style.cursor = 'grab';

    /* —— 滚轮缩放 —— */
    canvas.addEventListener('wheel', function (e) {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0014));
      holdFollow();
    }, { passive: false });

    /* —— 触摸：单指拖动 / 双指捏合缩放 —— */
    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var tt = e.changedTouches[i];
        pointers[tt.identifier] = { x: tt.clientX, y: tt.clientY };
      }
      nPointers = Object.keys(pointers).length;
      if (nPointers === 1) {
        var p0 = pointers[Object.keys(pointers)[0]];
        lastX = p0.x; lastY = p0.y;
        moved = 0;                                  // 用于区分"轻点放置"与"拖动平移"
      } else if (nPointers >= 2) {
        pinchDist = touchDist();
        moved = 999;                                // 双指操作不当作放置
      }
      holdFollow();
    }, { passive: false });

    canvas.addEventListener('touchmove', function (e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var tt = e.changedTouches[i];
        if (pointers[tt.identifier]) { pointers[tt.identifier].x = tt.clientX; pointers[tt.identifier].y = tt.clientY; }
      }
      nPointers = Object.keys(pointers).length;
      if (nPointers === 1) {
        var p0 = pointers[Object.keys(pointers)[0]];
        moved += Math.abs(p0.x - lastX) + Math.abs(p0.y - lastY);
        cam.cx -= (p0.x - lastX) / cam.zoom;
        cam.cy -= (p0.y - lastY) / cam.zoom;
        lastX = p0.x; lastY = p0.y;
        clampCam();
      } else if (nPointers >= 2) {
        moved = 999;
        var d = touchDist();
        if (pinchDist > 0 && d > 0) {
          var mid = touchMid();
          zoomAt(mid.x, mid.y, d / pinchDist);
        }
        pinchDist = d;
      }
      holdFollow();
    }, { passive: false });

    function endTouch(e) {
      var wasSingle = nPointers === 1;
      var p0 = wasSingle ? pointers[Object.keys(pointers)[0]] : null;
      for (var i = 0; i < e.changedTouches.length; i++) delete pointers[e.changedTouches[i].identifier];
      nPointers = Object.keys(pointers).length;
      /* 放置模式下的"轻点"（几乎没移动）＝选点放台风；拖动则只平移视角 */
      if (flags.place && wasSingle && p0 && moved < 10 && e.changedTouches.length === 1) {
        var ct = e.changedTouches[0];
        var w = screenToWorld(ct.clientX, ct.clientY);
        placeAt(w.x, w.y);
      }
      if (nPointers === 1) {
        var p1 = pointers[Object.keys(pointers)[0]];
        lastX = p1.x; lastY = p1.y;
      }
      pinchDist = 0;
      holdFollow();
    }
    canvas.addEventListener('touchend', endTouch, { passive: false });
    canvas.addEventListener('touchcancel', endTouch, { passive: false });

    /* —— 双击快速居中到台风 —— */
    canvas.addEventListener('dblclick', function () {
      var t = world.typhoon;
      cam.cx = t.x; cam.cy = t.y;
      holdFollow();
    });

    return { zoomAt: zoomAt };
  }

  /* ==========================================================================
   * 8. UI 控制绑定
   * ======================================================================== */
  var simPaused = false;
  var timeScale = CONFIG.timeScale;
  var world, renderer, flags = { dragging: false, _t: 0, place: false, mx: 0, my: 0 };

  var LABELS = {
    maxWind:       ['最大风速', ' m/s', 8, 88, 1, 0],
    pressure:      ['中心气压', ' hPa', 870, 1012, 1, 0],
    eyeRadius:     ['台风眼半径', ' km', 3, 45, 0.5, 1],
    spinRate:      ['旋转速度', ' ×', 0.2, 3, 0.05, 2],
    bandCount:     ['螺旋雨带数量', ' 条', 0, 8, 1, 0],
    particleCount: ['粒子数量', ' 个', 0, 9000, 100, 0],
    sst:           ['海表温度', ' ℃', 20, 36, 0.1, 1],
    shear:         ['风切变', ' m/s', 0, 30, 0.5, 1],
    moveSpeed:     ['移动速度', ' km/h', 0, 42, 0.5, 1],
    curvature:     ['路径弯曲', '', -6, 6, 0.1, 1],
    rainRate:      ['降雨强度', ' ×', 0.1, 2.5, 0.05, 2],
    timeScale:     ['时间流速', ' ×', 0, 5, 0.05, 2]
  };

  var SECTIONS = [
    { title: '强度与结构', keys: ['maxWind', 'pressure', 'eyeRadius', 'spinRate', 'bandCount', 'particleCount'] },
    { title: '海洋与大气环境', keys: ['sst', 'shear', 'moveSpeed', 'curvature', 'rainRate', 'timeScale'] }
  ];

  var TOGGLES = [
    ['wind', '显示风场'], ['isobar', '显示等压线'], ['band', '显示雨带'],
    ['path', '显示路径'], ['wcircle', '显示风圈'], ['fps', '显示 FPS']
  ];

  function fmt(key, v) {
    var L = LABELS[key];
    return (L[5] === 0 ? Math.round(v) : v.toFixed(L[5])) + L[1];
  }

  function ctlHTML(key) {
    var L = LABELS[key], v = CONFIG[key];
    return '<div class="ctl">' +
      '<div class="ctl-top"><span class="k">' + L[0] + '</span>' +
      '<span class="v" id="v_' + key + '">' + fmt(key, v) + '</span></div>' +
      '<input type="range" data-key="' + key + '" id="s_' + key + '" min="' + L[2] +
      '" max="' + L[3] + '" step="' + L[4] + '" value="' + v + '">' +
      '</div>';
  }

  function buildPanel() {
    var el = document.getElementById('panel');
    var html = '';
    html += '<div class="phead"><h1>台风模拟器</h1><span class="sub">TYPHOON SIM</span>' +
            '<button class="fold-arrow" id="foldBtn" title="折叠 / 展开面板">◀</button></div>';
    html += '<div class="pbody">';
    for (var s = 0; s < SECTIONS.length; s++) {
      html += '<details class="sect" open><summary>' + SECTIONS[s].title + '</summary>';
      var keys = SECTIONS[s].keys;
      for (var i = 0; i < keys.length; i++) html += ctlHTML(keys[i]);
      html += '</details>';
    }
    html += '<details class="sect" open><summary>显示图层</summary><div class="btns" id="toggleWrap">';
    for (var t = 0; t < TOGGLES.length; t++) {
      html += '<button class="b" data-toggle="' + TOGGLES[t][0] + '">' + TOGGLES[t][1] + '</button>';
    }
    html += '</div></details>';
    html += '<details class="sect" open><summary>操作</summary><div class="btns">' +
            '<button class="b wide" id="btnPlace">放置模式：关（点地图选位置）</button>' +
            '<button class="b" id="btnNew">生成新台风</button>' +
            '<button class="b" id="btnPause">暂停</button>' +
            '<button class="b" id="btnReset">重置</button>' +
            '<button class="b danger" id="btnClear">清除粒子</button>' +
            '<button class="b wide" id="btnSpin">旋转方向：北半球 · 逆时针</button>' +
            '<button class="b wide" id="btnFollow">自动跟随：开</button>' +
            '<button class="b wide" id="btnCenter">视角居中到台风</button>' +
            '</div></details>';
    html += '</div>';
    el.innerHTML = html;

    if (!CONFIG.panelOpen) el.classList.add('folded');
    document.getElementById('foldBtn').addEventListener('click', function () {
      el.classList.toggle('folded');
      CONFIG.panelOpen = !el.classList.contains('folded');
    });

    // 滑块：input 事件即时生效
    el.addEventListener('input', function (e) {
      var inp = e.target;
      if (inp && inp.tagName === 'INPUT' && inp.dataset && inp.dataset.key) {
        applyParam(inp.dataset.key, parseFloat(inp.value), true);
      }
    });

    // 按钮
    el.addEventListener('click', function (e) {
      var b = e.target && e.target.closest ? e.target.closest('button') : null;
      if (!b) return;
      if (b.dataset.toggle) {
        var key = b.dataset.toggle;
        CONFIG.visible[key] = !CONFIG.visible[key];
        syncToggles();
      } else if (b.id === 'btnNew') {
        world.newTyphoon();
      } else if (b.id === 'btnPlace') {
        flags.place = !flags.place;
        b.textContent = flags.place ? '放置模式：开（点地图选位置）' : '放置模式：关（点地图选位置）';
        b.classList.toggle('on', flags.place);
        /* 注意：这里不能用 setupControls 里的局部变量 canvas，作用域不同 */
        renderer.canvas.style.cursor = flags.place ? 'crosshair' : 'grab';
      } else if (b.id === 'btnPause') {
        simPaused = !simPaused;
        b.textContent = simPaused ? '继续' : '暂停';
        b.classList.toggle('on', simPaused);
        document.getElementById('stage').classList.toggle('paused', simPaused);
      } else if (b.id === 'btnReset') {
        doReset();
      } else if (b.id === 'btnClear') {
        for (var i = 0; i < world.pool.length; i++) world.pool[i].dead = true;
      } else if (b.id === 'btnSpin') {
        var t = world.typhoon;
        t.flipSpin = !t.flipSpin;
        t.hemi = t.flipSpin ? -1 : 1;
        b.textContent = '旋转方向：' + (t.flipSpin ? '南半球 · 顺时针' : '北半球 · 逆时针');
      } else if (b.id === 'btnFollow') {
        CONFIG.follow = !CONFIG.follow;
        b.textContent = '自动跟随：' + (CONFIG.follow ? '开' : '关');
        b.classList.toggle('on', CONFIG.follow);
        if (CONFIG.follow) {
          /* 立刻恢复跟随，否则要等上一次拖动/缩放的暂停计时器走完 */
          clearTimeout(flags._t);
          flags.dragging = false;
        }
      } else if (b.id === 'btnCenter') {
        cam.cx = world.typhoon.x;
        cam.cy = world.typhoon.y;
      }
    });
    syncToggles();
  }

  /** 参数实时生效：写入 CONFIG 并同步显示 */
  function applyParam(key, val, fromUI) {
    if (!isFinite(val)) return;
    CONFIG[key] = val;
    if (key === 'pressure') world.typhoon.pressureManual = true;
    if (key === 'timeScale') timeScale = val;
    if (key === 'particleCount') world.ensurePool(clamp(Math.round(val), 0, VIEW.maxParticles));
    if (key === 'maxWind' && world.typhoon.wind > val) world.typhoon.wind = val;
    var lab = document.getElementById('v_' + key);
    if (lab) lab.textContent = fmt(key, val);
  }

  function syncToggles() {
    var wrap = document.getElementById('toggleWrap');
    if (!wrap) return;
    var bs = wrap.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) {
      bs[i].classList.toggle('on', !!CONFIG.visible[bs[i].dataset.toggle]);
    }
  }

  function syncPanelValues() {
    for (var key in LABELS) {
      if (!LABELS.hasOwnProperty(key)) continue;
      var s = document.getElementById('s_' + key);
      if (s) s.value = CONFIG[key];
      var lab = document.getElementById('v_' + key);
      if (lab) lab.textContent = fmt(key, CONFIG[key]);
    }
  }

  function doReset() {
    var keepOpen = CONFIG.panelOpen;
    CONFIG = JSON.parse(JSON.stringify(DEFAULTS));
    CONFIG.panelOpen = keepOpen;
    timeScale = CONFIG.timeScale;
    /* 初始缩放：既要能看清台风结构，又要能看到"从太平洋深处走向亚太"的整条路径。
       这里取约 4600 km 宽（≈41 个经度），一条台风的一生基本都落在这个视野里。 */
    cam.zoom = clamp(Math.min(cam.vw / 4600, cam.vh / 2800), cam.minZoom, 2.4);
    var bp = document.getElementById('btnPause');
    if (bp) { bp.textContent = '暂停'; bp.classList.remove('on'); }
    var sp = document.getElementById('btnSpin');
    if (sp) sp.textContent = '旋转方向：北半球 · 逆时针';
    var bpl = document.getElementById('btnPlace');
    if (bpl) { bpl.textContent = '放置模式：关（点地图选位置）'; bpl.classList.remove('on'); }
    var bfo = document.getElementById('btnFollow');
    if (bfo) { bfo.textContent = '自动跟随：' + (CONFIG.follow ? '开' : '关'); bfo.classList.toggle('on', CONFIG.follow); }
    flags.dragging = !CONFIG.follow;
    flags.place = false;
    document.getElementById('stage').classList.remove('paused');
    world.reset();
    cam.cx = world.typhoon.x;
    cam.cy = world.typhoon.y;
    syncPanelValues();
    syncToggles();
    for (var i = 0; i < 13000; i++) if (world.pool[i]) world.pool[i].dead = true;
  }

  /* ==========================================================================
   * 9. 状态栏
   * ======================================================================== */
  var statusEl = document.getElementById('status');
  var _st = { wind: -1, press: -1, grade: '', stage: -1, pos: '', ring: '', perf: '' };

  function buildStatus() {
    statusEl.innerHTML =
      '<div class="stitle">实时状态 · STATUS</div>' +
      '<div class="row"><span class="l">强度等级</span><span class="r"><span id="stGrade">—</span></span></div>' +
      '<div class="row"><span class="l">最大风速</span><span class="r" id="stWind">—</span></div>' +
      '<div class="row"><span class="l">中心气压</span><span class="r" id="stPress">—</span></div>' +
      '<div class="row"><span class="l">生命周期</span><span class="r" id="stStage">—</span></div>' +
      '<div class="row"><span class="l">中心位置</span><span class="r" id="stPos">—</span></div>' +
      '<div class="row"><span class="l">风圈 7/10/12 级</span><span class="r" id="stRing">—</span></div>' +
      '<div class="row"><span class="l">粒子 / FPS</span><span class="r" id="stPerf">—</span></div>' +
      '<div class="bar"><i id="stBar"></i></div>';
  }

  /** 只在数值变化时写 DOM，避免每帧触发重排 */
  function updateStatus() {
    var t = world.typhoon;
    var wv = Math.round(t.wind * 10) / 10;
    if (wv !== _st.wind) {
      _st.wind = wv;
      document.getElementById('stWind').textContent = wv.toFixed(1) + ' m/s';
      document.getElementById('stBar').style.width = clamp(t.wind / 90 * 100, 0, 100) + '%';
    }
    var pv = Math.round(t.pressure);
    if (pv !== _st.press) {
      _st.press = pv;
      document.getElementById('stPress').textContent = pv + ' hPa';
    }
    var g = gradeOf(t.wind);
    if (g[1] !== _st.grade) {
      _st.grade = g[1];
      var ge = document.getElementById('stGrade');
      ge.textContent = g[1];
      ge.style.background = g[2];
    }
    if (t.stage !== _st.stage || simPaused) {
      _st.stage = t.stage;
      document.getElementById('stStage').textContent = STAGES[t.stage] + (simPaused ? '（已暂停）' : '');
    }
    /* 中心位置：以经纬度显示（等距圆柱投影，111 km/°） */
    var lv = fmtLon(xToLon(t.x)) + '  ' + fmtLat(yToLat(t.y));
    if (lv !== _st.pos) {
      _st.pos = lv;
      document.getElementById('stPos').textContent = lv;
    }
    /* 风圈半径：按 CMA 公报的写法给出七/十/十二级风圈（公里） */
    var r7v = Math.round(t.windR(7)), r10v = Math.round(t.windR(10)), r12v = Math.round(t.windR(12));
    var rv = r7v + ' / ' + r10v + ' / ' + (r12v > 0 ? r12v : '—') + ' km';
    if (rv !== _st.ring) {
      _st.ring = rv;
      document.getElementById('stRing').textContent = rv;
    }
    var perf = world.used + ' 个 / ' + renderer.fps.toFixed(0);
    if (perf !== _st.perf) {
      _st.perf = perf;
      document.getElementById('stPerf').textContent = perf;
    }
  }

  /* ==========================================================================
   * 10. 主循环
   * ======================================================================== */
  var lastTime = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    var dtReal = (now - lastTime) * 0.001;
    lastTime = now;
    if (!(dtReal > 0)) dtReal = 1 / 60;
    dtReal = Math.min(dtReal, 0.06);                 // 防止切换标签页后跳变

    var t = world.typhoon;

    /* —— 视角平滑跟随台风（关闭自动跟随、或用户拖动后 2.4 秒内都不打扰） —— */
    if (!flags.dragging && CONFIG.follow) {
      var fk = clamp(dtReal * 1.2, 0, 1) * 0.30;
      /* 一阶跟随天生带 v·dtSim/fk 的稳态滞后：台风移速按 6000/3600 的时间压缩折算后，
         这个滞后可达数百公里（时间流速 5× 时约 790 km），台风会明显偏离画面中心。
         补一个速度前馈（提前量 = 每帧位移 / fk）把它抵掉 —— 镜头依旧平滑，但咬得住台风。 */
      var lead = clamp(dtReal * clamp(timeScale, 0, 5), 0, 0.5) / Math.max(fk, 1e-4);
      cam.cx = lerp(cam.cx, t.x + t.vx * lead, fk);
      cam.cy = lerp(cam.cy, t.y + t.vy * lead, fk);
    }

    /* —— 生成过渡：旧台风快速消散，新台风淡入 —— */
    if (t.custom) {
      var el = now - t.custom.born;
      t.repel = clamp((el - t.custom.fadeAt) / 900, 0, 1);
      if (el > t.custom.takeOver && t.wind < 24) t.repel = 1;
    }

    /* —— 推进模拟（拆子步，保证高时间流速下运动稳定） —— */
    if (!simPaused) {
      var dtSim = dtReal * clamp(timeScale, 0, 5);
      var steps = clamp(Math.ceil(dtSim / 0.075), 1, 3);
      var sub = dtSim / steps;
      for (var s = 0; s < steps; s++) {
        t.update(sub, world);
        world.step(sub);
      }
      if (t.dissipating && t.repel <= 0 && t.wind <= 4.5) world.onDissipated(dtSim);
    }

    /* —— FPS 统计 —— */
    renderer._frames++;
    renderer._fpsT += dtReal;
    if (renderer._fpsT >= 0.5) {
      renderer.fps = renderer._frames / renderer._fpsT;
      renderer._frames = 0;
      renderer._fpsT = 0;
    }

    renderer.render(world, cam);
    renderer.autoQuality(dtReal);
    updateStatus();
  }

  /* ==========================================================================
   * 11. 启动
   * ======================================================================== */
  /** 运行期错误捕获：任何未处理异常都直接显示在页面上（并保留在控制台） */
  function installErrorCatcher() {
    var el = document.getElementById('errlog');
    var n = 0;
    function show(msg) {
      n++;
      if (!el) return;
      el.classList.add('show');
      el.textContent = '⚠ 运行期错误 ×' + n + '\n' + msg + '\n\n（点此关闭）';
      if (!el._bound) {
        el._bound = true;
        el.addEventListener('click', function () { el.classList.remove('show'); });
      }
    }
    window.addEventListener('error', function (e) {
      show((e && e.message ? e.message : '未知错误') +
           (e && e.filename ? '\n' + e.filename + ':' + (e.lineno || 0) + ':' + (e.colno || 0) : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      show('未处理的 Promise 拒绝：' + (r && r.message ? r.message : String(r)));
    });
  }

  function boot() {
    installErrorCatcher();
    var canvas = document.getElementById('stage');

    renderer = new Renderer(canvas);
    renderer.resize();
    world = new World();
    cam.vw = renderer.w; cam.vh = renderer.h;
    /* 初始缩放：既要能看清台风结构，又要能看到"从太平洋深处走向亚太"的整条路径。
       这里取约 4600 km 宽（≈41 个经度），一条台风的一生基本都落在这个视野里。 */
    cam.zoom = clamp(Math.min(cam.vw / 4600, cam.vh / 2800), cam.minZoom, 2.4);
    cam.cx = world.typhoon.x;
    cam.cy = world.typhoon.y;

    setupControls(canvas, renderer, world, flags);

    buildPanel();
    buildStatus();

    window.addEventListener('resize', function () {
      renderer.resize();
      cam.vw = renderer.w;
      cam.vh = renderer.h;
    });

    // 键盘快捷键
    window.addEventListener('keydown', function (e) {
      if (e.target && e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        var bp = document.getElementById('btnPause');
        if (bp) bp.click();
      } else if (e.key === 'n' || e.key === 'N') {
        world.newTyphoon();
      } else if (e.key === 'r' || e.key === 'R') {
        doReset();
      } else if (e.key === 'ArrowUp') {
        applyParam('timeScale', clamp(timeScale + 0.25, 0, 5), true);
        syncPanelValues();
      } else if (e.key === 'ArrowDown') {
        applyParam('timeScale', clamp(timeScale - 0.25, 0, 5), true);
        syncPanelValues();
      }
    });

    var hint = document.getElementById('hint');
    if (hint) setTimeout(function () { hint.classList.add('fade'); }, 6000);

    lastTime = performance.now();
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>

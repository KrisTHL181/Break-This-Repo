<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>drift · 粒子小玩具</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1013; }
  canvas { display: block; width: 100%; height: 100%; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 22px;
    text-align: center; pointer-events: none;
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: rgba(255,255,255,.34); letter-spacing: .06em;
    transition: opacity .6s ease;
  }
  .hint b { font-weight: 500; color: rgba(255,255,255,.62); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint"><b>移动鼠标</b>推开粒子 · 点一下重置</div>
<script>
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var hint = document.getElementById('hint'), touched = false;
  var W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
  var dots = [], mouse = { x: -1e4, y: -1e4 }, R = 130;

  function resize() {
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seed();
  }

  function seed() {
    var n = Math.round(Math.min(320, (W * H) / 5200));
    dots = [];
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = 0.12 + Math.random() * 0.34;
      dots.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        r: 0.7 + Math.random() * 1.5,
        h: 190 + Math.random() * 70
      });
    }
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i], dx = d.x - mouse.x, dy = d.y - mouse.y;
      var dist = Math.hypot(dx, dy);
      if (dist < R && dist > 0.001) {
        var f = (1 - dist / R) * 0.9;
        d.vx += (dx / dist) * f; d.vy += (dy / dist) * f;
      }
      d.vx *= 0.975; d.vy *= 0.975;
      var sp = Math.hypot(d.vx, d.vy);
      if (sp < 0.14) { var t = Math.random() * Math.PI * 2;
        d.vx += Math.cos(t) * 0.03; d.vy += Math.sin(t) * 0.03; }
      if (sp > 5) { d.vx = d.vx / sp * 5; d.vy = d.vy / sp * 5; }
      d.x += d.vx; d.y += d.vy;
      if (d.x < -12) d.x = W + 12; if (d.x > W + 12) d.x = -12;
      if (d.y < -12) d.y = H + 12; if (d.y > H + 12) d.y = -12;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, 6.283);
      ctx.fillStyle = 'hsla(' + d.h + ',72%,66%,.78)';
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('pointermove', function (e) {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (!touched) { touched = true; hint.style.opacity = 0; }
  });
  window.addEventListener('pointerleave', function () { mouse.x = mouse.y = -1e4; });
  window.addEventListener('pointerdown', function () { seed(); });

  resize();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>

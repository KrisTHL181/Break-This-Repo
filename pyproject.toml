[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "break-this-repo"
version = "0.0.0"
description = "A shared workspace for experiments and Python utilities"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["linux-portability-lab"]
pythonpath = ["linux-portability-lab"]
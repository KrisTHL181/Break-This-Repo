name: Auto Merge All PRs

on:
  schedule:
    # Every 30 minutes (minimum interval GitHub Actions supports;
    # actual runs may be delayed by a few minutes under load)
    - cron: "*/1 * * * *"
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write      # needed for PR comments/labels via gh
  contents: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: changed-path diff against origin/main needs the branch blobs

      - name: Merge open PRs (skipping protected changes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REASON=""

          # Paths a PR adds/modifies/deletes/renames. Computed locally from the already-
          # fetched FETCH_HEAD so there is no 3000-file cap: the REST files endpoint pages
          # 100 at a time and `gh api --paginate` stops at 3000 files, so a huge PR could
          # pad a directory and hide a protected path behind the cap. `--no-renames` makes
          # a rename surface as delete+add, so a protected path that is renamed away still
          # appears (old path preserved) and is caught.
          # Must distinguish failure: on any git error this returns nonzero AND leaves
          # CHANGED empty - a failed diff must never be mistaken for "no protected files".
          changed_paths() {
            CHANGED=""
            local out
            # `-z` emits raw, NUL-separated paths, so a filename containing a tab/newline
            # is NOT C-quoted (git diff --name-status quotes it, hiding a leading `.github`
            # behind a `"` and thus evading the path check below). `--name-only` needs
            # `--no-renames` so a rename surfaces as delete+add and a protected path that
            # was renamed away still appears. stderr is discarded so git warnings cannot
            # leak into the path list as phantom entries.
            out=$(git diff --name-only -z --no-renames -r origin/main FETCH_HEAD 2>/dev/null | tr '\0' '\n' | sed '/^$/d') || {
              REASON="could not compute the changed-path list from the local diff (conservative skip)"
              return 1
            }
            CHANGED="$out"
          }

          # Fetches the PR head into FETCH_HEAD and sets GUARD to one of:
          #   protected     - genuine protected-path violation: label + close (existing behavior)
          #   indeterminate - cannot tell (fetch/diff failure): comment + `check-failed` label,
          #                   leave open so the next cron cycle re-checks; NEVER merge
          #   ok            - not protected: merge
          # Also sets REASON (why) and CHANGED (changed-path list) when computable.
          check_pr() {
            GUARD=""
            REASON=""
            CHANGED=""
            if ! git fetch -q origin "pull/$1/head" 2>/dev/null; then
              REASON="head could not be fetched (conservative skip)"
              GUARD="indeterminate"
              return 0
            fi
            if ! changed_paths; then
              GUARD="indeterminate"
              return 0
            fi
            if grep -qE '^\.github(/|$)' <<< "$CHANGED"; then
              REASON="touches the protected \`.github/\` directory"
              GUARD="protected"
              return 0
            fi
            GUARD="ok"
            return 0
          }

          gh label create protected --color B60205 \
            --description "Touches protected paths; auto-closed" >/dev/null 2>&1 || true
          gh label create conflict --color FBCA04 \
            --description "Merge conflict; resolves itself once fixed" >/dev/null 2>&1 || true
          gh label create was-conflicted --color D876E3 \
            --description "Had a merge conflict at some point; resolved and merged" >/dev/null 2>&1 || true
          gh label create check-failed --color 6A737D \
            --description "Auto-merge check failed; will re-check next cycle" >/dev/null 2>&1 || true

          DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name' 2>/dev/null || echo main)
          # gh's `--jq` does not accept `--arg`, so pipe to the system jq to pass the branch
          # name as a variable (never interpolate it into the jq string). Scan a wide window,
          # then force-include any open PR already carrying the `protected` or `check-failed`
          # labels (one single-label query each) so a large flood cannot starve a pending
          # enforced/flagged PR out of this run.
          PRS=$(gh pr list --state open --limit 1000 --json number,isDraft,baseRefName \
                  | jq -r --arg base "$DEFAULT_BRANCH" \
                    '.[] | select(.isDraft | not) | select(.baseRefName == $base) | .number')
          STARVED_PROTECTED=$(gh pr list --state open --limit 1000 --label protected \
                  --json number,baseRefName \
                  | jq -r --arg base "$DEFAULT_BRANCH" \
                    '.[] | select(.baseRefName == $base) | .number')
          STARVED_FAILED=$(gh pr list --state open --limit 1000 --label check-failed \
                  --json number,baseRefName \
                  | jq -r --arg base "$DEFAULT_BRANCH" \
                    '.[] | select(.baseRefName == $base) | .number')
          PRS=$(printf '%s\n%s\n%s\n' "$PRS" "$STARVED_PROTECTED" "$STARVED_FAILED" \
                  | sed '/^$/d' | sort -u -n)
          if [ -z "$PRS" ]; then
            echo "No open PRs against the default branch '$DEFAULT_BRANCH'."
            exit 0
          fi

          for pr in $PRS; do
            echo "=== PR #$pr ==="
            check_pr "$pr"
            case "$GUARD" in
              protected)
                echo "🚫 Skipping: $REASON"
                if ! grep -qx protected <(gh pr view "$pr" --json labels --jq '.labels[].name'); then
                  printf '%s\n' "🚫 **Auto-merge skipped: this PR $REASON.**" "" "The \`.github/\` directory is off-limits and cannot be changed via pull requests. Fix the PR and it will merge automatically." > /tmp/comment.md
                  gh pr comment "$pr" --body-file /tmp/comment.md >/dev/null || echo "  (comment failed)"
                  gh pr edit "$pr" --add-label protected >/dev/null || true
                  gh pr close "$pr" >/dev/null || true
                fi
                ;;
              indeterminate)
                echo "⚠️ $REASON"
                # Fail closed: do NOT label `protected`, do NOT close, do NOT merge this
                # cycle. Comment once (guarded by the `check-failed` label) and let the
                # next cron cycle re-check the PR normally.
                if ! grep -qx check-failed <(gh pr view "$pr" --json labels --jq '.labels[].name'); then
                  printf '%s\n' "⚠️ **Auto-merge check failed: $REASON.**" "" "I couldn't verify whether this PR touches protected paths, so it won't be merged this cycle. It will be re-checked automatically on the next cron cycle — no action needed." > /tmp/check-failed-comment.md
                  gh pr comment "$pr" --body-file /tmp/check-failed-comment.md >/dev/null || echo "  (comment failed)"
                  gh pr edit "$pr" --add-label check-failed >/dev/null || true
                fi
                ;;
              ok)
                HEAD_SHA=$(git rev-parse FETCH_HEAD^{commit})
                echo "Merging at $HEAD_SHA ..."
                if gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" \
                     -f merge_method=merge -f sha="$HEAD_SHA" >/dev/null; then
                  echo "✅ Merged PR #$pr"
                  # Only PRs that are coming OUT of the conflict state get was-conflicted;
                  # never-conflicted merges must stay unlabeled
                  if grep -qx conflict <(gh pr view "$pr" --json labels --jq '.labels[].name'); then
                    gh pr edit "$pr" --remove-label conflict >/dev/null 2>&1 || true
                    gh pr edit "$pr" --add-label was-conflicted >/dev/null 2>&1 || true
                  fi
                else
                  MERGEABLE=$(gh pr view "$pr" --json mergeable --jq '.mergeable')
                  if [ "$MERGEABLE" = "CONFLICTING" ]; then
                    echo "🔀 PR #$pr has conflicts — labeling, NOT closing. Re-resolve and it merges automatically."
                    if ! grep -qx conflict <(gh pr view "$pr" --json labels --jq '.labels[].name'); then
                      printf '%s\n' "🔀 **This PR has merge conflicts with \`main\`, so auto-merge can't apply it yet.**" "" "No need to reopen or do anything drastic — just [update the branch](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/keeping-your-pull-request-in-sync-with-the-base-branch) (merge or rebase \`main\` into it, resolving the conflict). Once it merges cleanly, it will be merged automatically." > /tmp/conflict-comment.md
                      gh pr comment "$pr" --body-file /tmp/conflict-comment.md >/dev/null || echo "  (comment failed)"
                      gh pr edit "$pr" --add-label conflict >/dev/null || true
                    fi
                  else
                    echo "⚠️ Could not merge PR #$pr (head moved / transient error) - retried next cycle if still open"
                  fi
                fi
                ;;
            esac
          done

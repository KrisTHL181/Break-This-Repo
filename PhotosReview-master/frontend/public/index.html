<script src="js/utils.js"></script>

<script src="js/i18n.js"></script>
<script src="js/modal.js"></script>
<script>
    let uid = getCookie('review_uid');
    let token = getCookie('review_token');

    // 检查登录情况（2分钟一次）
    async function check_login() {
        // 获取结果
        let login_result = await getApi(url + `/api/user/check_token?uid=${uid}&token=${token}`);
        if (!login_result.result) {
            await openModal(
                i18n.lookUp("modal_content_fail")[12].title,
                i18n.lookUp("modal_content_fail")[12].message
            );
            document.body.innerHTML = '';
            window.location.href = "./loginout.html";
            return false;
        }
        setTimeout(() => {
            check_login();
        }, 2000 * 60);
    }
    // 获取工程列表
    async function get_proj(){
        let obj = await getApi(url + "/api/proj/get_proj_list");
        let cardContent = document.getElementById('cardContent');
        cardContent.innerHTML = '';
        // foreach循环
        obj.data.forEach(proj => {
            let a_type;
            let a_status;
            let a_status_color;
            let btlist
            switch (proj.proj_type){
                case 0:
                    a_type = i18n.lookUp("review_review_type");
                    break;

                case 1:
                    a_type = i18n.lookUp("screening_review_type");
                    break;

                default:
                    a_type = 'Unknown';
                    break;
            }
            switch (proj.proj_status){
                case 0:
                    a_status = i18n.lookUp("pending");
                    a_status_color = 'color_blue';
                    btlist = `
                        <button><i class="fa-solid fa-rocket"></i> ${i18n.lookUp("coming_soon")}</button>
                        `
                    break;

                case 1:
                    a_status = i18n.lookUp("progress");
                    a_status_color = 'color_green';
                    btlist = `
                        <button onclick="go_url('proj.html?proj=${proj.proj_id}&type=project',1)"><i class="fa-solid fa-tools"></i> ${i18n.lookUp("project_mode")}</button>
                        <button onclick="go_url('proj.html?proj=${proj.proj_id}&type=history',1)"><i class="fa-solid fa-history"></i> ${i18n.lookUp("history_mode")}</button>
                        `
                    break;

                case 2:
                    a_status = i18n.lookUp("finished");
                    a_status_color = 'color_orange';
                    btlist = `
                        <button onclick=""><i class="fa-solid fa-rocket"></i> ${i18n.lookUp("coming_soon")}</button>
                        `
                    break;

                case 3:
                    a_status = i18n.lookUp("rechecking");
                    a_status_color = 'color_purple';
                    btlist = `
                        <button onclick="go_url('proj.html?proj=${proj.proj_id}&type=recheck',1)"><i class="fa-solid fa-check-double"></i> ${i18n.lookUp("recheck_mode")}</button>
                        `
                    break;

                case 4:
                    a_status = i18n.lookUp("end");
                    a_status_color = 'color_red';
                    btlist = `
                        <button onclick="go_url('overall_view.html?proj_id=${proj.proj_id}',1)"><i class="fa-solid fa-eye"></i> ${i18n.lookUp("view_results")}</button>
                        `
                    break;

                default:
                    a_status = 'Unknown';
                    btlist = ``;
            }
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card_background" style="background:url('${url}/data/proj/${proj.proj_id + '/icon/' + proj.proj_thumbnail}') center/cover;">
                </div>
                <div style="z-index: 1;">
                    <img src="${url}/data/proj/${proj.proj_id + '/icon/' + proj.proj_thumbnail}" alt="Thumbnail">
                    <div class="card_text">
                        <h3>${proj.proj_name}</h3>
                        <p>
                            <i class="fa-solid fa-folder" title="type"></i>${a_type}
                            <br>
                            <i class="fa-solid fa-list-check" title="status"></i>
                            <span class="tag ${a_status_color}">${a_status}</span>
                            <br>
                            <i class="fa-regular fa-clock" title="time"></i>${proj.proj_time}
                        </p>
                        ${btlist}
                    </div>
                </div>
            `;
            cardContent.appendChild(card);

        });

        if (obj.data.length === 0) {
            cardContent.innerHTML = `<p style="font-size: 38px;text-align: center;width: 100%;color: var(--color-fg);">${i18n.lookUp("no_project")}</p>`;
        }
    }

    // 退出登录
    async function signout() {
        let a = await openModal(
            i18n.lookUp("modal_content_confirm")[0].title,
            i18n.lookUp("modal_content_confirm")[0].message
        );
        if(a){
            window.location.href = "./loginout.html"
        }
        else{
            return;
        }
    }

    async function loadWebsiteInfo() {
        const info = await getApi(url + "/api/system/get_website_info");
        if (info) {
            const infoObj = info.data;

            const link = document.createElement("link");
            link.rel = "icon";
            link.href = infoObj.website_icon;
            document.head.appendChild(link);

            document.querySelectorAll("[data-config]").forEach(el => {
                const key = el.getAttribute("data-config");
                if (key === "website_name") {
                    el.innerText = infoObj.website_name;
                }
                if (key === "website_url") {
                    el.addEventListener("click", () => {
                        window.location.href = url;
                    });
                }
            });

            document.getElementsByTagName("title")[0].innerText = infoObj.website_name;

        } else {
            setTimeout(() => {
                loadWebsiteInfo()
            }, 500);
        }
    }


    (async () => {
        await i18n.init();
        loadWebsiteInfo();
        // 检查cookie
        if (!uid || !token) {
            document.body.innerHTML = '';
            window.location.href = "./login.html";
            return false;
        }
        check_login();
        // 获取用户信息
        let user_info = await getApi(url + `/api/user/get_user_info?uid=${uid}&token=${token}`);
        if (user_info.result) {
            if (user_info.data.status == 0) {
                const pEl = document.createElement("p");
                pEl.innerHTML = `
                <button class="button-long" onclick='go_url("admin.html", 1)'><i class="fa-solid fa-gear"></i> <span data-i18n="backed_system">${i18n.lookUp("backed_system")}</span></button>`
                document.getElementById("widget_user_info").insertBefore(pEl, document.getElementById("widget_user_info").children[2]);
            }
        }
        // 获取工程列表
        await get_proj();
        document.getElementById("html_uid").innerHTML = getCookie("review_uid");
    })()

</script>

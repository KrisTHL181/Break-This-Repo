<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>台风模拟器 · Typhoon Simulator</title>
<style>
  :root{
    --bg:#03070f;
    --panel:rgba(10,18,33,.80);
    --panel-line:rgba(120,190,255,.20);
    --text:#d7eaff;
    --text-dim:#8ba6c4;
    --accent:#4fd6e8;
    --accent2:#ffd166;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{ position:fixed; inset:0; z-index:0; width:100%; height:100%; display:block; touch-action:none; }
  #stage.paused{ filter:saturate(.78) brightness(.93); }

  /* ---------- 控制面板 ---------- */
  #panel{
    position:fixed; top:12px; right:12px; width:306px;
    max-height:calc(100vh - 24px);
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:14px;
    backdrop-filter:blur(12px) saturate(140%);
    -webkit-backdrop-filter:blur(12px) saturate(140%);
    box-shadow:0 10px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    display:flex; flex-direction:column; z-index:10;
    transition:transform .25s ease;
  }
  #panel.folded{ transform:translateX(calc(100% - 46px)); }
  #panel.folded .fold-arrow{ transform:rotate(180deg); }
  .phead{
    display:flex; align-items:center; gap:8px;
    padding:10px 12px; border-bottom:1px solid rgba(120,190,255,.14);
    user-select:none;
  }
  .phead h1{
    font-size:14px; margin:0; letter-spacing:2px; font-weight:600; flex:1;
    background:linear-gradient(90deg,#6fe3ff,#ffd166);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .phead .sub{ font-size:10px; color:var(--text-dim); letter-spacing:1px; }
  .fold-arrow{
    width:26px; height:26px; border-radius:8px; cursor:pointer; flex:none;
    border:1px solid var(--panel-line); background:rgba(255,255,255,.04);
    color:var(--text); font-size:11px; line-height:1; display:grid; place-items:center;
    transition:transform .25s ease, background .2s;
  }
  .fold-arrow:hover{ background:rgba(120,190,255,.18); }
  .pbody{
    overflow-y:auto; overflow-x:hidden; padding:6px 12px 14px;
    scrollbar-width:thin; scrollbar-color:#2b4a6e transparent;
  }
  .pbody::-webkit-scrollbar{ width:8px; }
  .pbody::-webkit-scrollbar-thumb{ background:#2b4a6e; border-radius:4px; }

  details.sect{ border-top:1px solid rgba(120,190,255,.10); padding:6px 0 2px; }
  details.sect:first-of-type{ border-top:none; }
  details.sect>summary{
    cursor:pointer; list-style:none; font-size:11.5px; letter-spacing:1.5px;
    color:#9fd8ff; padding:5px 2px; user-select:none;
  }
  details.sect>summary::-webkit-details-marker{ display:none; }
  details.sect>summary::before{ content:"▸ "; color:var(--accent); }
  details.sect[open]>summary::before{ content:"▾ "; }

  .ctl{ margin:7px 0 9px; }
  .ctl-top{ display:flex; justify-content:space-between; align-items:baseline; font-size:11px; margin-bottom:3px; }
  .ctl-top .k{ color:#bcd8f2; letter-spacing:.5px; }
  .ctl-top .v{ color:var(--accent); font-variant-numeric:tabular-nums; }
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:16px;
    background:transparent; margin:0; cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px; border-radius:3px; background:linear-gradient(90deg,#1f6f8b,#2b3f57);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; margin-top:-5px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#eafcff,#4fd6e8 60%,#1c7f96);
    border:1px solid rgba(255,255,255,.5); box-shadow:0 0 8px rgba(79,214,232,.65);
  }
  input[type=range]::-moz-range-track{ height:4px; border-radius:3px; background:#2b3f57; }
  input[type=range]::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%; border:1px solid rgba(255,255,255,.5);
    background:radial-gradient(circle at 35% 35%,#eafcff,#4fd6e8 60%,#1c7f96);
  }

  .btns{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:9px; }
  button.b{
    font-family:inherit; font-size:11.5px; letter-spacing:1px; color:var(--text);
    background:linear-gradient(180deg,rgba(60,120,170,.30),rgba(20,45,75,.45));
    border:1px solid rgba(120,190,255,.28); border-radius:9px; padding:7px 6px;
    cursor:pointer; transition:all .16s; white-space:nowrap;
  }
  button.b:hover{ background:linear-gradient(180deg,rgba(90,180,230,.42),rgba(30,70,110,.55)); transform:translateY(-1px); }
  button.b:active{ transform:translateY(0); }
  button.b.wide{ grid-column:1 / -1; }
  button.b.on{ border-color:rgba(255,209,102,.75); color:#ffe6a8; background:linear-gradient(180deg,rgba(160,120,30,.42),rgba(70,50,10,.5)); }
  button.b.danger{ border-color:rgba(255,120,120,.5); color:#ffd0d0; }

  /* ---------- 状态栏 ---------- */
  #status{
    position:fixed; left:12px; top:12px; z-index:10; min-width:214px;
    background:var(--panel); border:1px solid var(--panel-line); border-radius:14px;
    backdrop-filter:blur(12px) saturate(140%); -webkit-backdrop-filter:blur(12px);
    box-shadow:0 10px 30px rgba(0,0,0,.5); padding:10px 12px 11px;
    font-size:11.5px; line-height:1.62; user-select:none;
  }
  #status .stitle{
    font-size:10px; letter-spacing:2px; color:var(--text-dim);
    border-bottom:1px solid rgba(120,190,255,.14); padding-bottom:5px; margin-bottom:6px;
  }
  #status .row{ display:flex; justify-content:space-between; gap:10px; }
  #status .row .l{ color:var(--text-dim); }
  #status .row .r{ color:#e6f5ff; font-variant-numeric:tabular-nums; text-align:right; }
  #stGrade{ padding:1px 7px; border-radius:6px; font-weight:600; color:#04222c; background:#4fd6e8; }
  #status .bar{ height:5px; border-radius:3px; background:rgba(255,255,255,.10); margin-top:7px; overflow:hidden; }
  #status .bar>i{ display:block; height:100%; width:0%; border-radius:3px;
    background:linear-gradient(90deg,#3ddc97,#4fd6e8,#ffd166,#ff6b4a); transition:width .25s; }
  #hint{
    position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:9;
    font-size:11px; color:#7f9cbd; letter-spacing:.6px; text-align:center;
    background:rgba(8,14,26,.55); border:1px solid rgba(120,190,255,.14);
    padding:5px 14px; border-radius:20px; backdrop-filter:blur(8px);
    pointer-events:none; transition:opacity 1.4s ease;
  }
  #hint.fade{ opacity:0; }
  /* 运行期错误捕获：出错时把信息显示在左下角，而不是只丢进控制台 */
  #errlog{
    position:fixed; left:12px; bottom:12px; z-index:40; margin:0; max-width:46vw; max-height:30vh;
    overflow:auto; display:none; white-space:pre-wrap; font:11px/1.5 ui-monospace,Consolas,monospace;
    color:#ffb4b4; background:rgba(40,6,10,.86); border:1px solid rgba(255,120,120,.45);
    border-radius:10px; padding:8px 10px;
  }
  #errlog.show{ display:block; }

  @media (max-width:760px){
    #panel{ width:auto; left:8px; right:8px; top:auto; bottom:8px; max-height:56vh; }
    #panel.folded{ transform:translateY(calc(100% - 44px)); }
    #status{ left:8px; right:8px; top:8px; min-width:0; font-size:11px;
      display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
    #status .stitle,#status .bar{ grid-column:1 / -1; }
    #hint{ display:none; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="status"></div>
<div id="panel"></div>
<div id="hint">拖动平移 · 滚轮/双指缩放 · 面板「放置模式」点地图选位置 · 空格暂停 / N 新台风</div>
<pre id="errlog"></pre>

<script>
/* ============================================================================
 *  台风模拟器 Typhoon Simulator
 *  单文件 / 原生 Canvas 2D / 零外部依赖
 *
 *  代码结构：
 *    CONFIG 配置对象  →  数学与颜色工具  →  精灵纹理缓存
 *    Particle 粒子类  →  Typhoon 台风类  →  World 世界（自动生成 / 粒子池）
 *    Renderer 渲染器  →  Camera 相机与交互  →  UI 控制绑定  →  主循环
 *
 *  物理与视觉要点：
 *    · 风场 = 修正 Rankine 涡（切向风）+ 边界层径向入流 + 环境风切变扰动 + 引导气流
 *    · 粒子随该风场平流，切向风自然缠绕成螺旋雨带；云层略有滞后 → 云带更厚实
 *    · 强度按海表温度/风切变决定的潜在强度演化，实时被滑块牵引
 *    · 地图为西北太平洋（100°E–180°E / 0°N–60°N，等距圆柱投影，1° ≈ 111 km）；
 *      台风默认在 5–20°N、122–158°E 的暖池生成，走"西北偏西 → 转向东北"的抛物线路径
 *
 *  时间尺度：强度按 m/s·h 的气象速率计算后再乘一个时间压缩系数，因此
 *  1 倍速下约 10 秒明显增强、约 45 秒成熟、整条生命周期约 1.5–2 分钟；
 *  想看更慢更真实的过程，把「时间流速」调到 0.2–0.5 即可。
 * ========================================================================== */
(function () {
  'use strict';

  /* ==========================================================================
   * 0. 常量与 CONFIG 配置对象
   * ======================================================================== */
  var TWO_PI = Math.PI * 2;
  var D2R = Math.PI / 180;

  /** 全局可视化参数（非随机台风属性） */
  var VIEW = {
    particleScale: 0.95,   // 风场粒子运动速度倍率（粒子被风平流的快慢）
    cloudDrift: 0.42,      // 云（高层）跟随低层风的权重，越小越滞后，云带越厚
    spinSwirl: 0.0012,     // 云带自旋附加项，帮助螺旋结构连续
    trailFade: 0.16,       // 每帧粒子轨迹衰减（透视残影，形成流线感）
    maxDPR: 2,             // 高 DPI 上限，保证性能
    maxParticles: 12000,
    adaptive: true         // 帧率偏低时自动降一档渲染倍率（掉帧自动回补）
  };

  /* —— 西北太平洋地图域 ——
     地图范围与内置的海岸线 / 地表色块数据一致：90°E–190°E、10°S–80°N，
     等距圆柱投影，世界坐标原点取地图左上角 (90°E, 80°N)，1° ≈ 111 km。
     世界坐标单位仍是 km，所以台风尺度、粒子速度等物理量都不受影响。 */
  var KM_PER_DEG = 111;
  var GEO = {
    lon0: 90, lat0: -10,                   // 投影原点（世界坐标零点对应的经纬度）
    lonMin: 90, lonMax: 190,               // 地图东西范围 90°E - 190°E
    latMin: -10, latMax: 80,               // 地图南北范围 10°S - 80°N
    /* 生成区：西北太平洋暖池主开发区（国际日期变更线以西、菲律宾以东的洋面）。
       历史上的台风绝大多数在这里生成，再向西北偏西移动影响东亚、东南亚。 */
    genesis: { lon: [128, 168], lat: [5, 20] }
  };
  GEO.worldW = (GEO.lonMax - GEO.lon0) * KM_PER_DEG;
  GEO.worldH = (GEO.latMax - GEO.lat0) * KM_PER_DEG;

  /** 经纬度 → 世界坐标(km) */
  function lonToX(lon) { return (lon - GEO.lon0) * KM_PER_DEG; }
  function latToY(lat) { return (GEO.latMax - lat) * KM_PER_DEG; }
  /** 世界坐标(km) → 经纬度 */
  function xToLon(x) { return GEO.lon0 + x / KM_PER_DEG; }
  function yToLat(y) { return GEO.latMax - y / KM_PER_DEG; }
  function fmtLon(lon) {
    return Math.abs(lon).toFixed(1) + '°' + (lon >= 0 ? 'E' : 'W');
  }
  function fmtLat(lat) {
    return Math.abs(lat).toFixed(1) + '°' + (lat >= 0 ? 'N' : 'S');
  }

  var CONFIG = {
    panelOpen: true,
    follow: true,          // 视角自动跟随台风中心（可在「操作」里关闭）
    visible: { wind: false, isobar: true, band: true, path: true, wcircle: true, fps: true },
    maxWind: 45,           // 最大风速目标值 m/s（实时牵引当前台风强度）
    pressure: 955,         // 中心气压 hPa（手动调整后进入手动模式）
    eyeRadius: 15,         // 台风眼半径 km
    spinRate: 1.00,        // 旋转速度倍率
    bandCount: 5,          // 螺旋雨带条数 0-8
    particleCount: 2600,   // 粒子总数
    sst: 29.0,             // 海表温度 ℃
    shear: 6,              // 环境垂直风切变 m/s
    moveSpeed: 16,         // 移动速度 km/h
    curvature: 3.0,        // 路径弯曲程度
    rainRate: 1.00,        // 降雨强度倍率
    timeScale: 1.0         // 时间流速
  };
  var DEFAULTS = JSON.parse(JSON.stringify(CONFIG));

  /* ==========================================================================
   * 1. 数学与颜色工具
   * ======================================================================== */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return (a + Math.random() * (b - a + 1)) | 0; }
  /** Irwin–Hall 近似正态分布，让随机属性更集中、更像真实观测 */
  function gauss() {
    return (Math.random() + Math.random() + Math.random() + Math.random() - 2) / 0.816;
  }

  /** 风速 m/s → RGB：弱风蓝绿、中风青黄、强风橙红 */
  function windRGB(v) {
    var S = [
      [8, 46, 96, 128],
      [17, 62, 190, 196],
      [30, 64, 224, 128],
      [42, 236, 212, 86],
      [58, 255, 142, 52],
      [78, 255, 74, 46],
      [95, 255, 236, 220]
    ];
    if (v <= S[0][0]) return [S[0][1], S[0][2], S[0][3]];
    for (var i = 1; i < S.length; i++) {
      if (v <= S[i][0]) {
        var t = (v - S[i - 1][0]) / (S[i][0] - S[i - 1][0]);
        return [
          Math.round(lerp(S[i - 1][1], S[i][1], t)),
          Math.round(lerp(S[i - 1][2], S[i][2], t)),
          Math.round(lerp(S[i - 1][3], S[i][3], t))
        ];
      }
    }
    var L = S[S.length - 1];
    return [L[1], L[2], L[3]];
  }

  /* ==========================================================================
   * 2. 精灵（软粒子纹理）缓存
   *    运行期不创建渐变对象，粒子绘制只是一次 drawImage
   * ======================================================================== */
  var SPR = (function () {
    var map = {};
    var SIZE = 32;

    function build(hex, key) {
      var c = document.createElement('canvas');
      c.width = c.height = SIZE;
      var g = c.getContext('2d');
      var grd = g.createRadialGradient(SIZE * .5, SIZE * .5, 0, SIZE * .5, SIZE * .5, SIZE * .5);
      grd.addColorStop(0.00, 'rgba(255,255,255,1)');
      grd.addColorStop(0.22, 'rgba(255,255,255,0.78)');
      grd.addColorStop(0.50, 'rgba(255,255,255,0.30)');
      grd.addColorStop(0.78, 'rgba(255,255,255,0.075)');
      grd.addColorStop(1.00, 'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, SIZE, SIZE);
      if (hex !== '255,255,255') {
        g.globalCompositeOperation = 'source-atop';
        g.fillStyle = 'rgba(' + hex + ',0.96)';
        g.fillRect(0, 0, SIZE, SIZE);
      }
      map[key] = c;
    }

    // 云：8 档冷白蓝，按局部风速挑选（强风速下云体更亮更"爆"）
    for (var t = 0; t < 8; t++) {
      var o = (t - 3.5) * 2.6;
      build(
        clamp(146 + o, 112, 255).toFixed(0) + ',' +
        clamp(200 + o * 1.25, 148, 255).toFixed(0) + ',' +
        clamp(240 + o * 0.5, 190, 255).toFixed(0), 'cloud' + t);
    }
    // 风：14 档风速色谱
    for (var w = 0; w < 14; w++) build(windRGB(8 + w * 6.5).join(','), 'w' + w);
    build('255,255,255', 'white');

    return {
      cloud: function (idx) { return map['cloud' + idx]; },
      wind: function (v) { return map['w' + clamp(Math.round((v - 8) / 6.5), 0, 13)]; },
      white: map.white
    };
  })();

  /* ==========================================================================
   * 3. Particle 粒子类
   *    cloud 云 · rain 雨 · spray 眼墙喷沫，全部被风场平流
   * ======================================================================== */
  function Particle() { this.dead = true; }

  Particle.prototype.reset = function (P, seeded, slot) {
    var core = P.rMax;
    var r, kind;
    /* 用槽位（对象池下标）决定粒子类型，而不是每次重掷随机数：
       否则云（寿命 10-26s）几乎不会死，而雨/眼墙（2-14s）不停重掷，
       长期平衡下画面会被云占满、雨带消失。分槽后三类比例恒定。 */
    var si = (((slot | 0) % 10) + 10) % 10;

    if (si < 3) {                          // 30% 眼墙区：最强回波
      kind = (si === 1) ? 'cloud' : 'spray';
      r = core * rand(0.84, 1.32);
    } else if (si < 7) {                   // 40% 螺旋雨带
      kind = (si === 5) ? 'cloud' : 'rain';
      r = core * rand(1.45, 5.0);
    } else {                               // 30% 外围弥散云系
      kind = (si === 9) ? 'rain' : 'cloud';
      r = core * rand(4.0, 9.5);
    }

    var a = Math.random() * TWO_PI;
    if (kind !== 'spray' && P.bands > 0 && r > core * 1.4 && Math.random() < 0.74) {
      // 对数螺旋约束方位角：让雨带连续可辨，而不是均匀糊成一团
      var band = randInt(0, P.bands - 1);
      var m = Math.log(Math.max(r / core, 1.02)) / P.spiralTight;
      a = ((band + m) / P.bands) * TWO_PI + rand(-0.11, 0.11);
    }

    this.kind = kind;
    this.a = a;
    this.r = r;
    this.x = P.x + Math.cos(a) * r;
    this.y = P.y + Math.sin(a) * r;
    this.age = seeded ? Math.random() * 0.9 : 0;
    this.vmag = 0;

    if (kind === 'cloud') {
      this.life = rand(10, 26);
      this.size = rand(4.5, 14);
      this.grow = rand(0.10, 0.42);
      this.alpha = rand(0.10, 0.26);
      // 云层跟随低层风的权重更低 → 相对涡旋"滞后"，螺旋云带更厚实、卷曲更明显
      this.driftK = rand(0.26, 0.54) * VIEW.cloudDrift / 0.42;
      this.alphaK = rand(0.70, 1.00);
      this.spin = rand(1.2, 2.4);
    } else if (kind === 'rain') {
      // 雨粒子寿命较长：保证稳态下"降雨粒子"始终在场，而不是瞬间消散
      this.life = rand(6, 14);
      this.size = rand(1.8, 5.0);
      this.grow = rand(-0.06, 0.10);
      this.alpha = rand(0.18, 0.45);
      this.driftK = rand(0.86, 1.14);
      this.alphaK = rand(0.55, 0.95);
      this.spin = rand(1.6, 2.8);
    } else {
      this.life = rand(2.4, 6.0);
      this.size = rand(1.2, 3.0);
      this.grow = rand(0, 0.08);
      this.alpha = rand(0.28, 0.62);
      this.driftK = rand(0.90, 1.20);
      this.alphaK = rand(0.70, 1.00);
      this.spin = rand(1.6, 2.6);
    }
    this.dead = false;
    return this;
  };

  /** 推进一个粒子：采样风场 → 叠加自身特性 → 位移 */
  Particle.prototype.step = function (P, dt, envK) {
    this.age += dt;
    var t = this.age / this.life;
    if (t >= 1) { this.dead = true; return; }

    var w = P.windAt(this.x, this.y, envK);
    this.vmag = w.mag;

    var k = this.driftK * VIEW.particleScale;
    var vx = w.x * k, vy = w.y * k;
    /* 台风的平移分量要按原速叠加，不能跟着 driftK 打折：
       windCore 返回的是"平移 + 涡旋相对风"，若整体乘 k，粒子就只以 0.25~1.14 倍
       的移速跟着走 —— 台风移动越快，云系被拖在身后的尾巴越长，快速移动时
       连眼墙都会甩到风眼后面。这里把平移补足到 1 倍，涡旋相对风仍按 k 缩放。 */
    vx += P.vx * (1 - k);
    vy += P.vy * (1 - k);
    var dx = this.x - P.x, dy = this.y - P.y;

    if (this.kind === 'cloud') {
      // 云带自旋：层叠的云在切向上持续缠绕，螺旋更清晰
      vx += -dy * VIEW.spinSwirl * this.spin;
      vy += dx * VIEW.spinSwirl * this.spin;
    } else if (this.kind === 'rain') {
      // 雨区向外沉降（雨带甩出感），同时略向下坠落
      var rr = Math.sqrt(dx * dx + dy * dy) || 1;
      vx += (dx / rr) * 0.055;
      vy += (dy / rr) * 0.055 - 0.018;
    }

    // 随机扰动：云雨边缘更自然
    var turb = this.kind === 'cloud' ? 0.05 : 0.03;
    this.x += (vx + rand(-turb, turb)) * dt;
    this.y += (vy + rand(-turb, turb)) * dt;

    if (Math.abs(dx) > 1700 || Math.abs(dy) > 1700) this.dead = true;
  };

  /** 绘制（生命周期淡入淡出 + 视野裁剪；绘制时依赖相机把世界坐标换算到屏幕） */
  Particle.prototype.draw = function (ctx, cam, flashK) {
    var t = this.age / this.life;
    var fade = clamp(t / 0.14, 0, 1) * clamp((1 - t) / 0.26, 0, 1);
    var a = this.alpha * fade * this.alphaK;
    if (a <= 0.004) return;

    var size = this.size * (1 + this.grow * this.age) * cam.zoom;
    if (size < 0.7) size = 0.7;
    else if (size > 96) size = 96;

    var sx = (this.x - cam.cx) * cam.zoom + cam.vw * 0.5;
    var sy = (this.y - cam.cy) * cam.zoom + cam.vh * 0.5;
    var hid = size * 1.05;
    if (sx < -hid || sy < -hid || sx > cam.vw + hid || sy > cam.vh + hid) return;

    var img;
    if (this.kind === 'cloud') {
      img = SPR.cloud(clamp(Math.round((this.vmag - 10) / 9), 0, 7));
      ctx.globalAlpha = clamp(a * (1 + flashK * 0.5), 0, 1);
    } else {
      img = SPR.wind(this.vmag);
      ctx.globalAlpha = clamp(a * (1 + flashK * 0.30), 0, 1);
    }
    var s = size * 2;
    ctx.drawImage(img, sx - size, sy - size, s, s);
  };

  /* ==========================================================================
   * 4. Typhoon 台风类
   *    生命周期：生成 → 增强 → 成熟 → 减弱 → 消散
   * ======================================================================== */
  var STAGES = ['生成', '增强', '成熟', '减弱', '消散'];
  /* CMA（中央气象台）台风等级配色：黄=热带低压、蓝=热带风暴、绿=强热带风暴、
     橙=台风、粉=强台风、红=超强台风；门限用《热带气旋等级》GB/T 19201 的 m/s 值。
     路径上的时次圆点、HUD 的强度等级都用这套色，和预报图对得上。 */
  var GRADE_TABLE = [
    [17.2, '热带低压', '#ffd24d'],
    [24.5, '热带风暴', '#4d9bff'],
    [32.7, '强热带风暴', '#35c759'],
    [41.5, '台风', '#ff9a2e'],
    [51.0, '强台风', '#ff7bc4'],
    [999, '超强台风', '#ff3b30']
  ];
  function gradeOf(v) {
    for (var i = 0; i < GRADE_TABLE.length; i++) if (v < GRADE_TABLE[i][0]) return GRADE_TABLE[i];
    return GRADE_TABLE[GRADE_TABLE.length - 1];
  }

  function Typhoon(world, spawn) {
    /* 默认在西北太平洋暖池生成（约 5-20°N, 122-158°E），
       这也是真实台风在该海区的常见源地；用户点选位置时传入 spawn。 */
    if (spawn) {
      this.x = clamp(spawn.x, 40, world.w - 40);
      this.y = clamp(spawn.y, 40, world.h - 40);
    } else {
      this.x = lonToX(rand(GEO.genesis.lon[0], GEO.genesis.lon[1]));
      this.y = latToY(rand(GEO.genesis.lat[0], GEO.genesis.lat[1]));
    }

    this.vx = 0; this.vy = 0;
    this.hemi = 1;                                   // 1 = 北半球(逆时针)，-1 = 南半球
    this.flipSpin = false;

    // —— 随机属性 ——
    /* 引导气流：西北太平洋台风在低纬受副热带高压南侧的偏东气流引导，
       以“西北偏西”路径为主；逼近副高西脊（22~31°N）后转向东北进入西风带，
       形成教科书上的抛物线路径。
       这里存的是**罗盘方位角**（0=北、90=东），换算成屏幕角度时才 -90°。 */
    this.steerB = rand(280, 308);                    // 初始引导方位：西 ~ 西北偏西
    this.recB = rand(38, 62);                        // 转向后的方位：东北
    this.recurve = latToY(rand(22, 31));             // 转向纬度（y 越小纬度越高）
    this.curve = 0;                                  // 路径弯曲程度（每次新台风重掷）
    this.curvPhase = 0;
    this.eye = clamp(CONFIG.eyeRadius * rand(0.78, 1.25), 3, 60);
    this.sst = clamp(CONFIG.sst + gauss() * 0.8, 20, 36);
    this.shear = clamp(CONFIG.shear + gauss() * 2.0, 0, 30);
    this.shearDir = Math.random() * TWO_PI;          // 切变方向（决定不对称方位）
    this.bands = clamp(Math.round(CONFIG.bandCount + gauss() * 0.7), 0, 8);
    /* 雨带数的连续量：不能直接用 this.bands 做 lerp——
       它每帧被四舍五入回整数，连续增量会被反复丢弃（5 → 5.045 → 5 → …），
       结果永远卡在初始值，滑块形同虚设。故单独保存连续值。 */
    this.bandsF = this.bands;
    this.rain = clamp(CONFIG.rainRate * rand(0.82, 1.22), 0.15, 2.5);
    this.pressureManual = false;

    this.wind = rand(12.5, 19);                      // 初始为弱低压
    this.targetWind = clamp(CONFIG.maxWind, 8, 90);
    this.pressure = 1010 - Math.pow(this.wind / 3.65, 1.42);

    this.t = 0;                                      // 已存活时长（模拟秒）
    this.stage = 0;
    this.arc = 0;                                    // 累计旋转相位
    this.peak = this.wind;
    this.lastWind = this.wind;
    this.vGrowth = 0.01;                             // 初始给正增长趋势，使弱涡能进入"增强"阶段
    this.rMax = 0;
    this.spiralTight = 1.02;
    this.envF = 1;
    this.repel = 1;                                  // 1 = 正常，0 = 已消散（不再产生风场）
    this.dissipating = false;
    this.overLand = false;                           // 中心是否已在陆地上（登陆后迅速减弱）
    /* 海洋热焓预算：1 = 能量充沛，越小越难维持强度。
       它随生命周期单调消耗，保证台风一定会从成熟走向减弱、消散。 */
    this.oceanEnergy = 1;
    this.stageT = 0;                                 // 当前阶段已持续时长（模拟秒）
    this.ceiling = this.targetWind;                  // 当前强度上限（每帧由 oceanEnergy 重算）

    this.path = [{ x: this.x, y: this.y }];          // 路径轨迹
    this.pathTimer = 0;
    this.flash = { t: 0, a: 0, x: this.x, y: this.y };
    this.custom = null;                              // 生成中被替换时，由 World 指定的收尾时序

    this.updateSpiral();
    this.rMax = this.calcRMax();
  }

  Typhoon.prototype.updateSpiral = function () {
    this.bands = clamp(Math.round(this.bands), 0, 8);
    this.spiralTight = 1.02 + this.bands * 0.055;
  };

  /** 最大风速半径：越强核心越小；同时保证台风眼占比合理 */
  Typhoon.prototype.calcRMax = function () {
    var core = 20 + 46 * Math.tanh((38 - this.wind) / 24);
    return Math.max(core, this.eye * 3.6, 18);
  };

  /** 内部：给定相对坐标得到风矢量（m/s） */
  Typhoon.prototype.windCore = function (px, py, ex, ey, K) {
    var dx = px - this.x, dy = py - this.y;
    var r = Math.sqrt(dx * dx + dy * dy);
    var mx = this.vx + ex * this.shear * 0.03;       // 环境引导气流 + 背景风
    var my = this.vy + ey * this.shear * 0.03;
    if (r < 0.05) return { x: mx, y: my, mag: 0, tan: 0, r: r, rl: 0 };

    var ux = dx / r, uy = dy / r;
    var sgn = this.hemi * (this.flipSpin ? -1 : 1);
    var tx, ty, tan, rl = Math.log(r / this.rMax);

    if (r < this.rMax) {
      // 眼内：近似固体旋转（切向风近线性增长）；留极少残余气流，眼不至于死寂
      tan = this.wind * (r / this.rMax) * 0.85;
      tx = -uy * tan * sgn;
      ty = ux * tan * sgn;
    } else {
      // 眼墙外：修正 Rankine 涡 r^-beta 衰减 + 远场缓冲
      var W = this.wind * Math.pow(this.rMax / r, 0.60);
      W *= 1 / (1 + Math.pow(r / (this.rMax * 9), 2.1));
      // 切变造成的方位角不对称：下切变侧对流被抑制
      W *= clamp(1 + 0.22 * K * Math.cos(Math.atan2(dy, dx) - this.shearDir), 0.55, 1.45);
      tan = W;
      tx = -uy * W * sgn;
      ty = ux * W * sgn;

      // 径向风：边界层入流（形成螺旋雨带）+ 切变偶极
      var M = Math.exp(-(rl * rl) / (2 * 0.80 * 0.80));
      tx += ux * (-tan * (0.26 * M + 0.05)) + ex * (-tan * M * 0.16 * K);
      ty += uy * (-tan * (0.26 * M + 0.05)) + ey * (-tan * M * 0.16 * K);
    }

    var vx = tx + mx, vy = ty + my;
    return { x: vx, y: vy, mag: Math.sqrt(vx * vx + vy * vy), tan: tan, r: r, rl: rl };
  };

  /** 对外：完整风场（已消散的台风不再产生任何风） */
  Typhoon.prototype.windAt = function (px, py, envK) {
    if (this.repel < 0.02) return { x: 0, y: 0, mag: 0, tan: 0, r: 1, rl: 0 };
    var K = envK === undefined ? this.shearK() : envK;
    return this.windCore(px, py, Math.cos(this.shearDir), Math.sin(this.shearDir), K * this.repel);
  };

  /** 切变强度归一化系数 */
  Typhoon.prototype.shearK = function () {
    return clamp(this.shear / 22, 0, 1);
  };

  /** 强度变化速率（m/s 每小时）；cap = 当前可达到的强度上限 */
  Typhoon.prototype.dIntensity = function (envK, M, cap) {
    if (this.dissipating) return -6.5;
    var top = cap === undefined ? M : cap;
    if (this.stage === 0) return 0.75;                       // 生成期缓慢组织
    if (this.stage === 1) {                                  // 增强
      var rate = this.wind < 24 ? 1.75 : 1.15;               // 弱涡阶段更易快速增强
      rate *= 1 - 0.75 * envK;                               // 强切变抑制增强
      rate *= clamp((top - this.wind) / 30, 0.05, 1.6);       // 越接近潜在强度越慢
      return clamp(rate, -1.8, 2.8);
    }
    if (this.stage === 2) {                                  // 成熟：在上限附近小幅震荡
      return clamp((top - this.wind) * 0.06, -0.55, 0.55) + gauss() * 0.05;
    }
    if (this.stage === 3) return clamp(-(0.85 + envK * 2.1), -3.4, -0.35); // 减弱
    return -4.5;                                             // 消散
  };

  /** 海表温度与风切变决定的最大潜在强度 (m/s) */
  Typhoon.prototype.potential = function () {
    return clamp(16 + (this.sst - 24) * 10.5 - this.shear * 0.95, 12, 92);
  };

  /** 请求消散（手动换台 / 移出计算域） */
  Typhoon.prototype.forceDissipate = function () {
    this.dissipating = true;
    this.repel = 0;
  };

  /**
   * 风圈半径（km）：七级 / 十级 / 十二级风圈。
   * 量级按中央气象台实况公报标定 —— 中心风速 45 m/s 的强台风：
   * 七级风圈半径 180~200 公里、十级 70~100 公里、十二级 40 公里。
   * 于是：七级 46+3.2v（45→190）、十级 2.6v-32（45→85）、十二级 2.2v-59（45→40）。
   */
  Typhoon.prototype.windR = function (level) {
    var v = this.wind;
    if (level === 7) return clamp(46 + 3.2 * v, 0, 420);
    if (level === 10) return Math.max(0, 2.6 * v - 32);
    return Math.max(0, 2.2 * v - 59);
  };

  /** 每帧推进台风状态；simDt = 模拟步长(秒)，为时间流速折算后的真实秒数 */
  Typhoon.prototype.update = function (simDt, world) {
    this.t += simDt;

    var envK = this.shearK();
    var dtHours = simDt / 3600;
    var targetWind = clamp(CONFIG.maxWind, 8, 90);
    this.targetWind = targetWind;
    /* 发展上限取"用户设定的最大风速"与"环境潜在强度×剩余海洋能量"的较小者：
       海温低/切变大时台风到不了滑块目标值，但必须在潜在强度附近转为成熟，
       否则会永远卡在"增强"阶段。 */
    var M = this.potential() * this.oceanEnergy;
    var ceiling = Math.max(8, Math.min(targetWind, M));
    this.ceiling = ceiling;

    /* —— 海洋能量预算 ——
       真实台风靠海表热焓维持，成熟期只能撑两三天。本模拟把时间压缩了数千倍，
       所以这里做一个同样加速的"热焓"消耗：成熟期持续越久、强度越高，衰减越快。
       它是台风必然走完"成熟 → 减弱 → 消散"的驱动力：
       少了它，成熟期 vGrowth 恒为 0，台风会永远停在成熟阶段。
       发展期（stage 0/1）几乎不消耗，保证台风能充分增强到环境允许的强度。 */
    if (this.stage === 2) this.stageT += simDt;
    var drain;
    if (this.stage === 2) drain = 0.0020 + (this.wind / 90) * 0.0034 + this.stageT * 0.00005;
    else if (this.stage === 3) drain = 0.0075;
    else if (this.stage === 4) drain = 0.0150;
    else drain = 0.0002;
    this.oceanEnergy = clamp(this.oceanEnergy - drain * simDt, 0.10, 1);

    /* —— 强度演化 —— */
    var diff = 0;
    if (this.stage <= 3 && !this.dissipating) {
      /* 时间压缩系数：把"气象时间"压成肉眼可观察的演化节奏。
         取 6000 时，1 倍速下约 10 秒就明显增强、约 45 秒发展为成熟台风、
         整条生命周期约 2 分钟；想更慢更真实可把时间流速调低。 */
      diff = this.dIntensity(envK, M, ceiling) * dtHours * 6000;
      this.wind += diff;
    }
    // 冷海温 / 强切变造成的持续衰减
    if (this.sst < 26.5) this.wind -= (26.5 - this.sst) * 0.012 * simDt;
    if (this.shear > 15) this.wind -= (this.shear - 15) * 0.010 * simDt;
    /* 高纬冷海面：西北太平洋 28°N 以北海温迅速下降，转向东北的台风
       一旦进入中纬就失去能量来源、很快变性减弱 —— 这是历史上台风
       极少以台风强度越过 45°N 的原因。 */
    var latNow = yToLat(this.y);
    if (latNow > 28) this.wind -= (latNow - 28) * 0.035 * simDt;

    /* —— 登陆摩擦：中心移到陆地上就断了热焓与水汽供应，强度迅速下降 ——
       按同一时间压缩比加速：1 模拟秒 ≈ 1.67 气象小时，
       所以 1.35 m/s 每模拟秒 ≈ 登陆后十几个气象小时腰斩，与实况量级相符。 */
    this.overLand = landAt(xToLon(this.x), yToLat(this.y)) === 1;
    if (this.overLand && !this.dissipating) {
      this.wind -= 1.35 * simDt;
      this.oceanEnergy = clamp(this.oceanEnergy - 0.016 * simDt, 0.10, 1);
    }

    if (this.dissipating) {
      // 快速收尾：风与气压一起降下来
      this.wind -= 5.5 * simDt;
      this.repel = clamp(this.repel - simDt * 0.5, 0, 1);
    }
    // 风速上限受滑块实时牵引
    this.wind = clamp(this.wind, 3, this.targetWind);

    /* —— 中心气压：与风速按统计关系耦合，手动调节优先 —— */
    if (this.pressureManual) {
      this.pressure = lerp(this.pressure, clamp(CONFIG.pressure, 860, 1013), clamp(simDt * 2.4, 0, 1));
    } else {
      var pT = clamp(1010 - Math.pow(this.wind / 3.65, 1.42), 865, 1013);
      this.pressure = lerp(this.pressure, pT, clamp(simDt * 0.9, 0, 1));
    }

    /* —— 结构参数实时跟随滑块 —— */
    var kk = clamp(simDt * 0.9, 0, 1);
    this.eye = lerp(this.eye, clamp(CONFIG.eyeRadius, 3, 60), kk);
    /* 雨带数收敛到滑块值：连续量存在 bandsF 里，bands 只是取整后的显示/绘制值。
       若直接对 this.bands 做 lerp，每帧的四舍五入会丢掉连续增量而不动。 */
    var bandTarget = clamp(CONFIG.bandCount, 0, 8);
    this.bandsF = lerp(this.bandsF, bandTarget, kk);
    if (Math.abs(this.bandsF - bandTarget) < 0.05) this.bandsF = bandTarget;
    this.bands = clamp(Math.round(this.bandsF), 0, 8);
    this.updateSpiral();
    this.rain = lerp(this.rain, clamp(CONFIG.rainRate, 0.1, 2.5), kk);
    this.sst = lerp(this.sst, clamp(CONFIG.sst, 20, 36), clamp(simDt * 0.25, 0, 1));
    this.shear = lerp(this.shear, clamp(CONFIG.shear, 0, 30), clamp(simDt * 0.25, 0, 1));
    this.rMax = this.calcRMax();

    /* —— 生命周期阶段判定 —— */
    this.vGrowth = lerp(this.vGrowth, diff, clamp(kk, 0, 1));
    this.peak = Math.max(this.peak, this.wind);

    if (this.dissipating) {
      this.stage = 4;
    } else if (this.t < 45 && this.wind < 20) {
      this.stage = 0;                                        // 生成
    } else if (this.stage === 2 && this.stageT < 26) {
      this.stage = 2;                                        // 成熟期至少维持一段时间
    } else if (this.stage === 3) {
      this.stage = this.wind < 20 ? 4 : 3;                   // 一旦减弱就不再回转
      if (this.stage === 4) this.forceDissipate();
    } else if (this.wind >= ceiling - 3 && this.oceanEnergy > 0.30) {
      this.stage = 2;                                        // 成熟
    } else if (this.vGrowth > 1e-7 && this.wind < ceiling - 3) {
      this.stage = 1;                                        // 增强
    } else {
      this.stage = this.wind < 20 ? 4 : 3;                   // 减弱 / 消散
      /* 自然耗尽的台风也必须进入消散流程（dissipating = true），
         否则主循环里的"消散 → 自动生成下一个台风"永远不会触发：它只认 dissipating。 */
      if (this.stage === 4) this.forceDissipate();
    }

    /* —— 旋转相位 —— */
    this.arc += (40 + this.wind * 1.42) * CONFIG.spinRate * simDt * this.hemi;

    /* —— 移动：引导气流 + 副高西缘转向 + 路径摆动 ——
       西北太平洋台风的典型路径：先从暖池向西北偏西移动，
       到 22~31°N 一带受西风带引导转向东北，形成抛物线路径。
       坐标约定：世界 x 向东、y 向南，所以屏幕角度 θ（方向向量 = cosθ, sinθ）
       与罗盘方位 b 的换算是 θ = b - 90°。 */
    this.curvPhase += simDt / 26;
    var curvK = clamp(CONFIG.curvature / 6, -1.2, 1.6);
    /* 转向因子：纬度越高越偏向东北（0 = 未转向，1 = 完全转向） */
    var rec = clamp((this.recurve - this.y) / 1100, 0, 1);
    rec = rec * rec * (3 - 2 * rec);                          // 平滑过渡
    /* 方位角必须在罗盘空间插值：290° → 410°(=50°)，途经正北，
       才是真实的顺时针转向；直接在屏幕角度上线性插值会经过正南，画出一个假回环。 */
    var brg = this.steerB + (this.recB + 360 - this.steerB) * rec
            + (Math.sin(this.curvPhase * 0.9) * 26
             + Math.sin(this.curvPhase * 0.37 + 1.7) * 14) * curvK;   // 路径摆动（有界）
    var steerEff = (brg - 90) * D2R;
    /* 时间压缩比：强度演化按 dtHours*6000 推进，即 1 模拟秒 = 6000/3600 ≈ 1.67 气象小时。
       移动速度必须用同一个压缩比，否则台风一辈子只挪两三个纬度，
       看不出“从太平洋深处一路走向亚太”的历史规律。 */
    var spd = clamp(CONFIG.moveSpeed, 0, 42) * (6000 / 3600);   // km/h → km/模拟秒
    var tx = Math.cos(steerEff) * spd;
    var ty = Math.sin(steerEff) * spd;
    var kv = clamp(simDt * 0.6, 0, 1);
    this.vx = lerp(this.vx, tx, kv);
    this.vy = lerp(this.vy, ty, kv);
    this.x += this.vx * simDt;
    this.y += this.vy * simDt;

    /* 出界处理：计算域就是地图范围（90°E–190°E / 10°S–80°N）。
       台风中心越过地图边界一定距离后判定为"移出预报区"，进入消散流程；
       北侧进入中高纬西风带被斜压能掏空、南侧靠近赤道失去科氏力支撑，同样消散。
       两个必须留意的坑：
       ① 世界 y 轴**向南为正**，所以"北上过高纬"是 y 很小、"南下近赤道"是 y 很大，
          旧版两者写反了；
       ② 旧版末尾还有四条反弹钳制把台风夹在 x∈[0,w]、y∈[0,h]，
          于是"越过边界 pad 公里才消散"的条件永远不可能满足（整段是死代码）。 */
    var pad = 500, w = world.w, h = world.h, drift = 0;
    if (this.y < -pad) drift = 1;                                    // 北上过高纬
    else if (this.y > h + pad) drift = 0;                            // 南下近赤道
    else if (this.x < -pad) drift = 2;                               // 向西移出预报区
    else if (this.x > w + pad) drift = 3;                            // 向东移出预报区

    if (!this.dissipating && drift !== 0) {
      this.dissipating = true;
      this.driftType = drift;
    }

    if (drift) {
      // 消散中不再拉回，只夹在画面外不远处，任其淡出
      if (drift === 1) this.y = Math.max(this.y, -pad);
      if (drift === 0) this.y = Math.min(this.y, h + pad);
      if (drift === 2) this.x = Math.max(this.x, -pad);
      if (drift === 3) this.x = Math.min(this.x, w + pad);
    }

    /* —— 路径采样 —— */
    this.pathTimer += simDt;
    if (this.pathTimer > 0.55) {
      this.pathTimer = 0;
      this.path.push({ x: this.x, y: this.y, w: this.wind, r7: this.windR(7) });
      if (this.path.length > 1200) this.path.shift();
    }

    /* —— 雷暴闪光：眼墙随机位置，低频、短促 —— */
    if (!this.dissipating && this.stage >= 1 && this.stage <= 3 && this.wind > 28) {
      if (Math.random() < 0.14 * simDt) {
        var aa = Math.random() * TWO_PI;
        var rr = this.rMax * rand(0.9, 1.6);
        this.flash.t = 1;
        this.flash.a = 1;
        this.flash.x = this.x + Math.cos(aa) * rr;
        this.flash.y = this.y + Math.sin(aa) * rr;
      }
    }
    if (this.flash.a > 0) this.flash.a = Math.max(0, this.flash.a - simDt * 1.6);
  };

  /* ==========================================================================
   * 5. World 世界：粒子池、自动生成、重生
   * ======================================================================== */
  function World() {
    this.w = GEO.worldW;                 // 计算域 = 西北太平洋地图范围（km）
    this.h = GEO.worldH;
    this.pool = [];
    this.used = 0;
    this.typhoon = new Typhoon(this);
    this._seeded = 0;
    this._deadTime = 0;
  }

  /** 按需扩展粒子对象池（对象只增不减，运行期零分配） */
  World.prototype.ensurePool = function (n) {
    var cap = Math.min(n, VIEW.maxParticles);
    while (this.pool.length < cap) this.pool.push(new Particle());
  };

  /** 维持粒子总数：复用死亡对象，保持粒子群年龄分散 */
  World.prototype.maintain = function () {
    var want = clamp(Math.round(CONFIG.particleCount), 0, VIEW.maxParticles);
    this.ensurePool(want);
    var seeded = this._seeded === 0;
    for (var i = 0; i < want; i++) {
      var p = this.pool[i];
      if (p.dead) p.reset(this.typhoon, seeded || i % 3 === 0, i);
    }
    if (seeded) this._seeded = 1;
    this.used = want;
  };

  World.prototype.step = function (simDt) {
    var t = this.typhoon;
    var envK = t.shearK();
    this.maintain();
    for (var i = 0; i < this.used; i++) {
      var p = this.pool[i];
      if (!p.dead) p.step(t, simDt, envK);
    }
  };

  /** 生成新台风：旧台风快速消散后自然移交。spawn 可选，指定落点(世界坐标 km) */
  World.prototype.newTyphoon = function (spawn) {
    if (this.typhoon) this.typhoon.forceDissipate();
    var nt = new Typhoon(this, spawn);
    nt.custom = { born: performance.now(), fadeAt: 850, takeOver: 7500 };
    this.typhoon = nt;
    this._seeded = 0;
    this._deadTime = 0;
    return nt;
  };

  World.prototype.reset = function () {
    for (var i = 0; i < this.pool.length; i++) this.pool[i].dead = true;
    this.used = 0;
    this.typhoon = new Typhoon(this);
    this._seeded = 0;
    this._deadTime = 0;
  };

  /** 等待旧台风消散，随后自动接上新台风 */
  World.prototype.onDissipated = function (simDt) {
    if (this._suppressAuto) return;
    this._deadTime += simDt;
    if (this._deadTime > 3.5) this.newTyphoon();
  };

  /* ==========================================================================
   * 6. Renderer 渲染器
   * ======================================================================== */
  function Renderer(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.dpr = 1;
    this._quality = 1;                   // 渲染倍率（自适应降档用）
    this._qt = 0;
    this.w = 1; this.h = 1;
    this.ocean = document.createElement('canvas');
    this.octx = this.ocean.getContext('2d');
    this._oceanZ = 0;                    // 当前贴图对应的缩放（跨过阈值才重建）
    this.fps = 0; this._frames = 0; this._fpsT = 0;
    this._isoCache = null;
  }

  Renderer.prototype.resize = function () {
    var w = window.innerWidth, h = window.innerHeight;
    this.dpr = clamp(window.devicePixelRatio || 1, 1, VIEW.maxDPR) * this._quality;
    this.w = w; this.h = h;
    this.canvas.width = Math.round(w * this.dpr);
    this.canvas.height = Math.round(h * this.dpr);
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this._vig = null;                    // 尺寸变化后重建暗角渐变
    this.buildOcean(TILE_PX);
  };

  /** 自适应渲染倍率：帧率偏低时降到 0.68 倍分辨率（像素工作量约减半），
      帧率恢复到 52 以上再逐级升回来。低倍率时略微提高粒子透明度补偿观感。 */
  Renderer.prototype.autoQuality = function (dtReal) {
    if (!VIEW.adaptive) return;
    this._qt = (this._qt || 0) + dtReal;
    if (this._qt < 2.2) return;                   // 每 2.2 秒最多调整一次
    this._qt = 0;
    var f = this.fps;
    if (f <= 0) return;
    if (f < 34 && this._quality > 0.60) {
      this._quality = Math.max(0.60, this._quality - 0.20);
      this.resize();
    } else if (f > 52 && this._quality < 1) {
      this._quality = Math.min(1, this._quality + 0.20);
      this.resize();
    }
  };

  /* 深海贴图是"平铺单元"，这里规定它在**屏幕**上的边长（CSS px）。
     世界边长 = TILE_PX / zoom，所以平铺格子不论怎么缩放都只有 384 屏幕像素。
     早先贴图固定 900 世界 km，放大到 1.5~3 倍后一个格子被拉到 1300~2700 屏幕
     像素，7 个大斑块就变成满屏重复的蓝色方块 —— 这就是那个网格 bug 的根因。 */
  var TILE_PX = 384;
  var OCEAN_BASE = '#04042c';

  /** 生成"按像素对齐"的回绕噪声采样表：给每个像素位置预先算好双线性混合的
      四个格点值与权重。格点用整数坐标哈希，i0+N 与 i0 取到同一个值，所以表在
      左右/上下边界首尾相连 → 平铺无缝。
      （坑：格点若先归一化成 0~1 小数再取模，整数格点会全部塌成 0，
        整层噪声变成常数、斑块完全不出现。）
      做成"按像素查表"而不是每个像素现算，是因为现算噪声重建一次要 1 秒以上，
      缩放时整页会卡住；查表版把热循环压到只剩乘加。 */
  function buildNoiseAxis(S, N, seed) {
    var v0 = new Float32Array(S), v1 = new Float32Array(S);
    var w0 = new Float32Array(S), w1 = new Float32Array(S);
    var f = N / S;
    for (var p = 0; p < S; p++) {
      var x = p * f;
      var i0 = Math.floor(x);
      var fr = x - i0;
      var sm = fr * fr * (3 - 2 * fr);
      i0 = ((i0 % N) + N) % N;
      v0[p] = i0; v1[p] = (i0 + 1) % N;
      w0[p] = 1 - sm; w1[p] = sm;
    }
    return { N: N, seed: seed, v0: v0, v1: v1, w0: w0, w1: w1 };
  }
  function hashAt(seed, i, j) {
    var n = Math.sin(i * 127.1 + j * 311.7 + seed * 74.7) * 43758.5453;
    return n - Math.floor(n);
  }
  function buildNoiseVal(ax, S) {
    var N = ax.N, seed = ax.seed;
    var val = new Float32Array(N * N);
    for (var j = 0; j < N; j++) {
      for (var i = 0; i < N; i++) {
        val[j * N + i] = hashAt(seed, i, j);
      }
    }
    return val;
  }

  /** 预渲染深海贴图（深浅起伏 + 散点噪点）。S = 贴图像素边长。
      两条硬约束：① 左右上下必须无缝；② 不能烤进任何与屏幕尺寸相关的东西
      （屏幕暗角由 render 末尾统一加），否则平铺会出现明暗硬边。
      做法：低频起伏全部来自回绕噪声，不用 createRadialGradient 画圆、
      也不用 stroke 画长条 —— 圆和长条在贴图边界会被裁掉一半，平铺后就是接缝。 */
  Renderer.prototype.buildOcean = function (S) {
    this.ocean.width = S;
    this.ocean.height = S;
    var g = this.octx;
    if (!this._oceanImg || this._oceanImg.width !== S) {
      this._oceanImg = g.createImageData(S, S);      // 复用缓冲区，避免每次重建都分配
    }
    var img = this._oceanImg;
    var d = img.data;
    var BR = 4, BG = 5, BB = 44;                   // 基色 #04052c：参考图的深海就是这个蓝

    /* 两层起伏：大尺度每贴图 3 个（深海层次）+ 细尺度每贴图 13 个（海面细纹）。
       采样位置按像素预算好（含回绕），热循环里只剩乘加。 */
    var layers = [
      { ax: buildNoiseAxis(S, 3, 3.1), amp: 0.26 },
      { ax: buildNoiseAxis(S, 13, 7.7), amp: 0.12 },
    ];
    for (var a = 0; a < layers.length; a++) layers[a].val = buildNoiseVal(layers[a].ax, S);

    for (var py = 0; py < S; py++) {
      var rowB = py * S;
      /* 纵向的两个格点行与权重（每行只算一次） */
      var j0a = layers[0].ax.v0[py], j1a = layers[0].ax.v1[py], wya = layers[0].ax.w1[py];
      var j0b = layers[1].ax.v0[py], j1b = layers[1].ax.v1[py], wyb = layers[1].ax.w1[py];
      var Na = layers[0].ax.N, Nb = layers[1].ax.N;
      var va = layers[0].val, vb = layers[1].val;
      var r0a = j0a * Na, r1a = j1a * Na, r0b = j0b * Nb, r1b = j1b * Nb;
      for (var px = 0; px < S; px++) {
        var v0a = layers[0].ax.v0[px], v1a = layers[0].ax.v1[px], wxa = layers[0].ax.w1[px];
        var v0b = layers[1].ax.v0[px], v1b = layers[1].ax.v1[px], wxb = layers[1].ax.w1[px];
        var ta = va[r0a + v0a] + (va[r0a + v1a] - va[r0a + v0a]) * wxa;
        var ba = va[r1a + v0a] + (va[r1a + v1a] - va[r1a + v0a]) * wxa;
        var tb = vb[r0b + v0b] + (vb[r0b + v1b] - vb[r0b + v0b]) * wxb;
        var bb = vb[r1b + v0b] + (vb[r1b + v1b] - vb[r1b + v0b]) * wxb;
        var k1 = (ta + (ba - ta) * wya) - 0.5;
        var k2 = (tb + (bb - tb) * wyb) - 0.5;
        var k = k1 * 0.26 + k2 * 0.12;
        var i = (rowB + px) * 4;
        d[i] = BR + (k > 0 ? 9 * k : 0);
        d[i + 1] = BG + (k > 0 ? 13 * k : 0);
        d[i + 2] = BB + (k > 0 ? 30 * k : 0);
        d[i + 3] = 255;
      }
    }
    // 散点噪点：打散大面积渐变的色带感（只提亮蓝通道，保持"纯蓝深海"的观感）
    for (var t = 0, n = Math.floor(S * S / 900); t < n; t++) {
      var nx = Math.floor(Math.random() * S), ny = Math.floor(Math.random() * S);
      var jj = (ny * S + nx) * 4, up = 6 + Math.random() * 10;
      d[jj] += up * 0.15; d[jj + 1] += up * 0.35; d[jj + 2] += up;
    }
    g.putImageData(img, 0, 0);
  };

  /** 缩放明显变化时按新的世界尺寸重烤贴图，保证屏幕上的重复周期恒定。
      只在跨过 1.25 倍阈值时重建（烤一次 384×384 约 5 ms），
      否则每帧重建会白白吃掉帧时间。 */
  Renderer.prototype.ensureOceanScale = function (zoom) {
    if (this._oceanZ > 0 && zoom / this._oceanZ < 1.25 && zoom / this._oceanZ > 0.80) return;
    this._oceanZ = zoom;
    this.buildOcean(TILE_PX);
  };

  /** 海面：把贴图按世界坐标平铺满可视范围。
      贴图的世界边长 = TILE_PX / zoom，屏幕边长恒为 TILE_PX。 */
  Renderer.prototype.drawOcean = function (ctx, cam) {
    var left = cam.cx - cam.vw * 0.5 / cam.zoom;
    var top = cam.cy - cam.vh * 0.5 / cam.zoom;
    var right = cam.cx + cam.vw * 0.5 / cam.zoom;
    var bottom = cam.cy + cam.vh * 0.5 / cam.zoom;
    var S = TILE_PX / cam.zoom;              // 贴图的世界边长（km）
    /* 缩到很小时贴图数量会爆炸（每帧几百次 drawImage），
       此时改用底色铺满：深海本来就接近纯色，视觉上无差别。 */
    if ((right - left) / S * ((bottom - top) / S) > 420) {
      ctx.fillStyle = OCEAN_BASE;
      ctx.fillRect(left, top, right - left, bottom - top);
      return;
    }
    var x0 = Math.floor(left / S) * S, y0 = Math.floor(top / S) * S;
    for (var wy = y0; wy < bottom; wy += S) {
      for (var wx = x0; wx < right; wx += S) {
        ctx.drawImage(this.ocean, wx, wy, S, S);
      }
    }
  };

  /** 经纬网：每 10° 一条细线（每 20° 稍亮），交点处标"160E / 20N"。
      参考图里经纬网是压在陆地上层的，所以本函数在 drawMap 之后调用；
      线条按可视范围动态铺满（不再受 GEO 边界限制），缩得极小时整体不画。 */
  Renderer.prototype.drawGrid = function (ctx, cam) {
    var z = cam.zoom;
    var left = cam.cx - cam.vw * 0.5 / z, right = cam.cx + cam.vw * 0.5 / z;
    var top = cam.cy - cam.vh * 0.5 / z, bottom = cam.cy + cam.vh * 0.5 / z;
    var lon10 = Math.ceil(xToLon(left) / 10) * 10, lon10e = Math.floor(xToLon(right) / 10) * 10;
    var lat10 = Math.ceil(yToLat(bottom) / 10) * 10, lat10e = Math.floor(yToLat(top) / 10) * 10;
    if (lon10e - lon10 > 360 || lat10e - lat10 > 180) return;   // 缩得极小：线密到没有意义

    ctx.save();
    ctx.lineWidth = 1 / z;
    var lon, lat, gx, gy;
    /* 20° 的整数倍：亮一档，也是标注所在的那一档 */
    ctx.beginPath();
    for (lon = Math.ceil(xToLon(left) / 20) * 20; lon <= lon10e; lon += 20) {
      gx = lonToX(lon); ctx.moveTo(gx, top); ctx.lineTo(gx, bottom);
    }
    for (lat = Math.ceil(yToLat(bottom) / 20) * 20; lat <= lat10e; lat += 20) {
      gy = latToY(lat); ctx.moveTo(left, gy); ctx.lineTo(right, gy);
    }
    ctx.strokeStyle = 'rgba(96,178,232,0.30)';
    ctx.stroke();
    /* 剩下的 10° 线：暗一档，只是把格子再切细 */
    ctx.beginPath();
    for (lon = lon10; lon <= lon10e; lon += 10) {
      if (lon % 20 === 0) continue;
      gx = lonToX(lon); ctx.moveTo(gx, top); ctx.lineTo(gx, bottom);
    }
    for (lat = lat10; lat <= lat10e; lat += 10) {
      if (lat % 20 === 0) continue;
      gy = latToY(lat); ctx.moveTo(left, gy); ctx.lineTo(right, gy);
    }
    ctx.strokeStyle = 'rgba(96,178,232,0.13)';
    ctx.stroke();

    /* 交点标注：一个交点只写一个（经度/纬度交替），和参考图一样疏朗；
       字太小会糊，缩得很小时整块不画。
       标注要屏幕恒定字号，所以先回到屏幕空间再画（线宽用 1/z 抵消缩放，
       文字没法这样抵消，必须换坐标系）。 */
    if (z > 0.25) {
      var ox = cam.vw * 0.5 - cam.cx * z, oy = cam.vh * 0.5 - cam.cy * z;
      ctx.save();
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.font = '10px "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.lineWidth = 2.8;
      ctx.strokeStyle = 'rgba(3,12,26,0.72)';      // 深色描边 + 浅灰字：压在陆地/海洋上都读得清
      ctx.fillStyle = 'rgba(198,206,216,0.62)';
      var c0 = Math.ceil(xToLon(left) / 20) * 20, r0 = Math.ceil(yToLat(bottom) / 20) * 20;
      for (lon = c0; lon <= lon10e; lon += 20) {
        gx = lonToX(lon) * z + ox;
        if (gx < -20 || gx > cam.vw + 20) continue;
        for (lat = r0; lat <= lat10e; lat += 20) {
          gy = latToY(lat) * z + oy;
          if (gy < 8 || gy > cam.vh + 8) continue;
          /* 棋盘式交替：偶数格写经度、奇数格写纬度 */
          var txt = (((lon / 20) + (lat / 20)) % 2 === 0)
            ? (lon === 180 || lon === -180 ? '180' : (lon < 0 ? -lon + 'W' : lon + 'E'))
            : (lat === 0 ? '0N' : (lat < 0 ? -lat + 'S' : lat + 'N'));
          ctx.strokeText(txt, gx + 3, gy - 3);
          ctx.fillText(txt, gx + 3, gy - 3);
        }
      }
      ctx.restore();
    }

  /* —— 海岸线解码 ——

     每个轮廓先写点数、再写首点经纬度、之后是各点的经纬度增量（单位 1/64 度）。
     解码在第一次画地图时做一次，之后一直复用。 */
  var _dcStr = COAST_DATA, _dcPos = 0;
  function dcU() {
    var v = 0, sh = 0, c;
    do { c = COAST_CODE.indexOf(_dcStr.charAt(_dcPos++)); v += (c & 31) << sh; sh += 5; } while (c & 32);
    return v;
  }
  function dcZ() { var v = dcU(); return (v % 2) ? -(v + 1) / 2 : v / 2; }

  /** 解码 → [{pts: 世界坐标 x,y 交替的 Float64Array, box}] */
  function decodeCoast() {
    _dcPos = 0;                 // 复位读指针，保证可以重复调用（否则第二次会解出空表）
    var list = [], n = dcU(), i, j;
    for (i = 0; i < n; i++) {
      var cnt = dcU();
      var pts = new Float64Array(cnt * 2);
      var qx = dcZ(), qy = dcZ();
      pts[0] = lonToX(90 + qx / 64);
      pts[1] = latToY(qy / 64);
      var x0 = pts[0], y0 = pts[1], x1 = x0, y1 = y0;
      for (j = 1; j < cnt; j++) {
        qx += dcZ(); qy += dcZ();
        var wx = lonToX(90 + qx / 64), wy = latToY(qy / 64);
        pts[j * 2] = wx; pts[j * 2 + 1] = wy;
        if (wx < x0) x0 = wx; else if (wx > x1) x1 = wx;
        if (wy < y0) y0 = wy; else if (wy > y1) y1 = wy;
      }
      list.push({ pts: pts, box: [x0, y0, x1, y1] });
    }
    return list;
  }

  /** 轮廓 → Path2D；step>1 时按步长抽稀，供缩小时的粗糙档使用 */
  function buildCoastPath(list, step) {

    for (i = 0; i < list.length; i++) {
      var pts = list[i].pts, n = pts.length / 2;

      嵌套层级天然正确，不需要手工把陆地切成好几块。 */
  function coastPath(z) {

      h: latToY(TERRAIN_GEO.lat0 - TERRAIN_GEO.rows * TERRAIN_GEO.step) - latToY(TERRAIN_GEO.lat0)

  /* —— 1° 海陆栅格：判断台风中心是否已经登陆 ——

     行/列各 1°（≈111 km），覆盖 90°E–190°E / 10°S–80°N，共 100×90 格。
     为什么要单独做一张栅格：真实台风登陆后失去海面热焓与水汽供应，12 小时内
     强度通常腰斩，而地图数据里的地表色块只有"颜色"，不能直接当海陆掩膜用
     （透明格既可能是海、也可能是无数据的陆地）。 */
  var LG_LON0 = 90, LG_LAT0 = 80, LG_COLS = 100, LG_ROWS = 90;

      var xs = [];

        var c1 = Math.floor(xToLon(xs[m + 1]) - LG_LON0);
        for (var c = Math.max(0, c0); c <= Math.min(LG_COLS - 1, c1); c++) g[r * LG_COLS + c] = 1;

    return g;

  function landAt(lon, lat) {

    return landGrid()[((LG_LAT0 - lat) | 0) * LG_COLS + ((lon - LG_LON0) | 0)];

     一张可无缝平铺的程序化噪声（16×16 格点、首尾回绕），

  var _reliefCv = null, RELIEF_PX = 256, RELIEF_SCREEN = 430;
  function reliefCanvas() {

    [141.4, 43.1, '札幌', 0.46, 1], [121.0, 14.6, '马尼拉', 0.30, 1],
    [100.5, 13.8, '曼谷', 0.34, 1], [105.8, 21.0, '河内', 0.40, 1],

  /** 陆地上的起伏质感：把可平铺的噪声按"屏幕固定周期"叠在陆地里，
      让大陆不至于是一块死板色块。噪声周期固定在屏幕上（RELIEF_SCREEN 像素），
      不随缩放变化 —— 贴图周期若跟着世界坐标走，放大后会变成满屏重复的方块。
      path 用 even-odd 裁剪，岛屿和大陆都吃得上。 */
  Renderer.prototype.drawLandRelief = function (ctx, path, cam) {
    var z = cam.zoom;
    if (z < 0.35) return;
    var S = RELIEF_SCREEN / z;               // 屏幕周期换算成世界边长（km）
    var left = cam.cx - cam.vw * 0.5 / z, top = cam.cy - cam.vh * 0.5 / z;
    var right = cam.cx + cam.vw * 0.5 / z, bottom = cam.cy + cam.vh * 0.5 / z;

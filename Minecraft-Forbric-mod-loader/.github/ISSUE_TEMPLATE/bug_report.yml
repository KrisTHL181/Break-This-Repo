name: Bug report
description: Report a problem you encountered while using Forbric.
body:
  - type: markdown
    attributes:
      value: |
        Use the title field above to summarize the problem in one sentence.

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Describe what happened and what you expected. Include screenshots and relevant version information if available.
      placeholder: What problem did you encounter while using Forbric?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps that trigger the problem. If you cannot reproduce it consistently, describe what you were doing when it occurred.
      placeholder: |
        1. Install or launch...
        2. Perform the following action...
        3. Observe the problem...
    validations:
      required: true

  - type: upload
    id: logs
    attributes:
      label: Logs
      description: Drag and drop or click to upload log files (.log, .txt) or archives (.zip, .gz). Leave this empty if no logs are available.
    validations:
      required: false
      accept: ".log,.txt,.zip,.gz"

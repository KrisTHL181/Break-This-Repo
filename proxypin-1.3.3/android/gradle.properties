org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
android.nonFinalResIds=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# ---- 本机(arm64 Ubuntu)构建适配 ----
# 该机的 vortex 代理不可用，移除；改用本机可用的直连
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m
org.gradle.workers.max=4
kotlin.daemon.jvmargs=-Xmx1024m
# arm64 主机上没有 x86_64 的 aapt2，改用 Debian 的 arm64 aapt2
android.aapt2FromMavenOverride=/tmp/aapt2bin/aapt2

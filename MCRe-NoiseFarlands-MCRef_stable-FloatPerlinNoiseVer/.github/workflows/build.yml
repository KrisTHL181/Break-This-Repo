name: Build Game

on:
  workflow_dispatch:
    inputs:
      disable_build:
        description: 'Disable build and publish (only archive source)'
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - '**'
      - '!no-build-**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm-cache

permissions:
  contents: write

jobs:
  archive-source:
    name: Archive Source Code (Old & New)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current code (NEW)
        uses: actions/checkout@v4
        with:
          path: new_source

      - name: Checkout previous commit (OLD)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
          path: old_source

      - name: Package OLD source
        if: github.event_name == 'push'
        run: |
          zip -r Source_Code_Old.zip old_source -x "*.git*"

      - name: Package NEW source
        run: |
          zip -r Source_Code.zip new_source -x "*.git*"

      - name: Upload OLD source artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Source_Code_Old
          path: Source_Code_Old.zip

      - name: Upload NEW source artifact
        uses: actions/upload-artifact@v4
        with:
          name: Source_Code
          path: Source_Code.zip

  build-windows:
    name: Build Windows
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.disable_build != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup caches
        uses: ./.github/actions/setup-cache
        with:
          host: linux
          target: win

      - name: Setup Ninja
        uses: ./.github/actions/setup-ninja
        with:
          host: linux

      - name: Download llvm-mingw
        run: |
          curl -L https://github.com/mstorsjo/llvm-mingw/releases/download/20260311/llvm-mingw-20260311-msvcrt-ubuntu-22.04-x86_64.tar.xz -o llvm-mingw.tar.xz
          tar -xf llvm-mingw.tar.xz
          mv llvm-mingw-* llvm-mingw

      - name: Setup Boost headers for Windows
        run: |
          mkdir -p lib/include
          if [ ! -d "lib/include/boost" ]; then
            curl -L https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.gz -o /tmp/boost.tar.gz
            tar xf /tmp/boost.tar.gz -C /tmp
            mv /tmp/boost_1_83_0/boost lib/include/
          fi

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        working-directory: ${{github.workspace}}/build
        run: |
          cmake $GITHUB_WORKSPACE \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=$GITHUB_WORKSPACE/llvm-mingw/bin/x86_64-w64-mingw32-clang \
            -DCMAKE_CXX_COMPILER=$GITHUB_WORKSPACE/llvm-mingw/bin/x86_64-w64-mingw32-clang++ \
            -DCMAKE_RC_COMPILER=$GITHUB_WORKSPACE/llvm-mingw/bin/x86_64-w64-mingw32-windres \
            -DALSOFT_BACKEND_PIPEWIRE=OFF \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        working-directory: ${{github.workspace}}/build
        run: cmake --build . --config $BUILD_TYPE --target MinecraftPE --parallel

      - name: Copy data directory to build output
        run: |
          cp -r ${{github.workspace}}/data ${{github.workspace}}/build/data

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
            name: mcpe-windows
            path: |
               /home/runner/work/MCRe-NoiseFarlands/MCRe-NoiseFarlands/build/MinecraftPE.exe
               /home/runner/work/MCRe-NoiseFarlands/MCRe-NoiseFarlands/build/libpng16.dll
               /home/runner/work/MCRe-NoiseFarlands/MCRe-NoiseFarlands/build/OpenAL32.dll
               /home/runner/work/MCRe-NoiseFarlands/MCRe-NoiseFarlands/build/libz.dll
               /home/runner/work/MCRe-NoiseFarlands/MCRe-NoiseFarlands/build/libc++.dll
               /home/runner/work/MCRe-NoiseFarlands/MCRe-NoiseFarlands/build/libunwind.dll
               /home/runner/work/MCRe-NoiseFarlands/MCRe-NoiseFarlands/build/data/**

  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.disable_build != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_PATH: ${{ github.workspace }}/android-ndk-r23c
      ANDROID_PLATFORM_API: 36
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
      ADB: /bin/true
      MATRIX_ABI: ${{ matrix.abi }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Android command-line tools
        id: cache-android-tools
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: android-cmdline-tools-v36

      - name: Setup Android command line tools
        if: steps.cache-android-tools.outputs.cache-hit != 'true'
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -o cmdline-tools.zip -L "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
            unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-${ANDROID_PLATFORM_API}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Cache Android NDK r23c
        id: cache-android-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-ndk-r23c
          key: android-ndk-r23c

      - name: Install Android NDK r23c
        if: steps.cache-android-ndk.outputs.cache-hit != 'true'
        run: |
          if [ ! -d "$ANDROID_NDK_PATH" ]; then
            curl -L -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r23c-linux.zip"
            unzip -q ndk.zip
          fi

      - name: Install system prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget unzip curl git python3 libncurses6 libtinfo6
          if ! ldconfig -p | grep -q "libncurses.so.5"; then
            sudo lninux_ncurses.so.5 || true
          fi
          if ! ldconfig -p | grep -q "libtinfo.so.5"; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          fi

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Validate environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_PATH=$ANDROID_NDK_PATH"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "MATRIX_ABI=$MATRIX_ABI"
          $ANDROID_SDK_ROOT/platform-tools/adb version || true
          java -version
          javac -version

      - name: Run Android build script
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minecraftpe-apk-${{ matrix.abi }}
          path: ${{ github.workspace }}/build-apk/minecraftpe-*-debug.apk
          
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup caches
        uses: ./.github/actions/setup-cache
        with:
          host: linux
          target: linux

      - name: Create Build Environment
        # Some projects don't allow in-source building, so create a separate build directory
        # We'll use this as our working directory for all subsequent commands
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Setup Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install gcc-multilib
          sudo apt-get install -y --no-install-recommends \
          build-essential libgl-dev libwayland-dev xorg-dev libxkbcommon-dev \
          libboost-all-dev
      
      - name: Configure CMake
        # Use a bash shell so we can use the same syntax for environment variable
        # access regardless of the host operating system
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: cmake $GITHUB_WORKSPACE \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_CXX_FLAGS='-Wno-error'

      - name: Build
        working-directory: ${{github.workspace}}/build
        shell: bash
        timeout-minutes: 30
        run: cmake --build . --config $BUILD_TYPE --target MinecraftPE --parallel 2
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpe-linux
          path: |
            ${{github.workspace}}/build/MinecraftPE

  build-windows-dedicated-server:
    name: Build Dedicated Server (Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download llvm-mingw
        run: |
          curl -fsSL -o llvm-mingw64.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20241001/llvm-mingw-20241001-ucrt-ubuntu-20.04-x86_64.tar.xz
          mkdir -p llvm-mingw && tar xf llvm-mingw64.tar.xz -C llvm-mingw --strip-components=1

      - name: Download Boost for Windows
        run: |
          mkdir boost-win && cd boost-win
          curl -fsSL -o boost.tar.bz2 \
            https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.bz2
          tar xf boost.tar.bz2 --strip-components=1

      - name: Patch RakNet for 64-bit Windows
        run: |
          sed -i 's/GetProcessAffinityMask(mProc, &mProcMask, &mSysMask)/GetProcessAffinityMask(mProc, (PDWORD_PTR)\&mProcMask, (PDWORD_PTR)\&mSysMask)/' \
          project/lib_projects/raknet/jni/RaknetSources/GetTime.cpp
          sed -i 's/register //g' \
          project/lib_projects/raknet/jni/RaknetSources/Rand.cpp
      
      - name: Configure
        env:
          CC: ${{ github.workspace }}/llvm-mingw/bin/x86_64-w64-mingw32-clang
          CXX: ${{ github.workspace }}/llvm-mingw/bin/x86_64-w64-mingw32-clang++
        run: |
          mkdir -p build-server-win && cd build-server-win
          cmake .. \
           -DCMAKE_BUILD_TYPE=Release \
           -DCMAKE_SYSTEM_NAME=Windows \
           -DCMAKE_CROSSCOMPILING=TRUE \
           -DCMAKE_CXX_FLAGS='-Wno-c++11-narrowing' \
           -DBOOST_ROOT="${{ github.workspace }}/boost-win" \
           -DBOOST_INCLUDEDIR="${{ github.workspace }}/boost-win"
        working-directory: project/dedicated_server

      - name: Build
        env:
          CC: ${{ github.workspace }}/llvm-mingw/bin/x86_64-w64-mingw32-clang
          CXX: ${{ github.workspace }}/llvm-mingw/bin/x86_64-w64-mingw32-clang++
        run: cmake --build build-server-win --parallel $(nproc)
        working-directory: project/dedicated_server

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mcpe-server-win-x64
          path: project/dedicated_server/build-server-win/mcpe_server.exe

  build-linux-dedicated-server:
    name: Build Dedicated Server (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev g++-multilib

      - name: Configure + Build
        run: |
          cmake -S . -B build-server --fresh \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-m64' \
            -DCMAKE_CXX_FLAGS='-m64 -fno-sized-deallocation'
          cmake --build build-server --parallel $(nproc)
        working-directory: project/dedicated_server


      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mcpe-server-linux-x64
          path: project/dedicated_server/build-server/mcpe_server

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.disable_build != 'true') && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Declare Version Variables
        id: ref
        run: |
          echo "version=$(cat VERSION | xargs)" >> $GITHUB_OUTPUT
          echo "hash=$(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Zip Windows Artifacts
        uses: vimtor/action-zip@v1.2
        with:
          files: mcpe-windows/
          dest: minecraftpe-${{ steps.ref.outputs.hash }}-windows.zip

      - name: Zip Android arm64-v8a Artifact
        uses: vimtor/action-zip@v1.2
        with:
          files: minecraftpe-apk-arm64-v8a/minecraftpe-*-debug.apk
          dest: minecraftpe-${{ steps.ref.outputs.hash }}-android-arm64-v8a.zip

      - name: Zip Android armeabi-v7a Artifact
        uses: vimtor/action-zip@v1.2
        with:
          files: minecraftpe-apk-armeabi-v7a/minecraftpe-*-debug.apk
          dest: minecraftpe-${{ steps.ref.outputs.hash }}-android-armeabi-v7a.zip

      - name: Zip Data
        uses: vimtor/action-zip@v1.2
        with:
          files: data
          recursive: false
          dest: data.zip

      - name: Update Development Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: dev
          name: 'Development Release'
          body: |
            MinecraftPE development release for commit ${{ github.sha }}.
          files: |
            ./data.zip
            ./minecraftpe-${{ steps.ref.outputs.hash }}-windows.zip
            ./minecraftpe-${{ steps.ref.outputs.hash }}-android-arm64-v8a.zip
            ./minecraftpe-${{ steps.ref.outputs.hash }}-android-armeabi-v7a.zip

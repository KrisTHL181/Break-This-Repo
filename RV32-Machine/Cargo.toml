[package]
name = "rv32-machine"
version = "0.1.0"
edition = "2021"
description = "A GUI-based RV32IMAC simulator with UART, Audio, VGA, USB, and PLIC peripherals"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
wgpu = "24"
env_logger = "0.11"
log = "0.4"
cpal = "0.15"
ringbuf = "0.5"
parking_lot = "0.12"
bytemuck = "1.21"
thiserror = "2"